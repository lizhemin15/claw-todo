// 因为父页面 viewport 锁死 1280px，CSS @media 不生效
// 方案：触摸设备 + 物理屏幕窄 → 手机/小平板
// screen.availWidth 是物理CSS像素，不受viewport影响
const isNarrowScreen = screen.availWidth <= 1024;
const isMobileScreen = isTouchDevice && isNarrowScreen;
const touchControls = document.getElementById('touch-controls');
if (isMobileScreen) {
  touchControls.style.display = 'block';
  console.log('Touch controls enabled: availWidth=' + screen.availWidth);
}

// 触摸事件绑定（只在触摸设备上生效）
// 摇杆
const joystickZone = document.getElementById('joystick-zone');
const thumb = document.getElementById('joystick-thumb');
const base = document.getElementById('joystick-base');
let joyId = null, joyCenter = { x: 0, y: 0 };
const maxDist = 48; // 拇指最大偏移

joystickZone.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    if (joyId === null) {
      joyId = t.identifier;
      const rect = joystickZone.getBoundingClientRect();
      joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      thumb.classList.add('active');
    }
  }
  e.preventDefault();
}, { passive: false });

joystickZone.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > maxDist) { dx *= maxDist / dist; dy *= maxDist / dist; }
      thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      touchState.mz = -dy / maxDist; // 上=前进
      touchState.mx = dx / maxDist;  // 右=右移
    }
  }
  e.preventDefault();
}, { passive: false });

const resetJoystick = () => {
  joyId = null;
  thumb.style.transform = 'translate(-50%, -50%)';
  thumb.classList.remove('active');
  touchState.mx = 0; touchState.mz = 0;
};

joystickZone.addEventListener('touchend', e => {
  for (const t of e.changedTouches) { if (t.identifier === joyId) resetJoystick(); }
});
joystickZone.addEventListener('touchcancel', resetJoystick);

// 视角拖拽
const lookZone = document.getElementById('touch-look-zone');
let lookId = null, lastLook = { x: 0, y: 0 };

lookZone.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    if (lookId === null && t.identifier !== joyId) {
      lookId = t.identifier;
      lastLook = { x: t.clientX, y: t.clientY };
    }
  }
});

lookZone.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === lookId) {
      touchState.lookDx = t.clientX - lastLook.x;
      touchState.lookDy = t.clientY - lastLook.y;
      lastLook = { x: t.clientX, y: t.clientY };
    }
  }
  e.preventDefault();
}, { passive: false });

const resetLook = () => { lookId = null; touchState.lookDx = 0; touchState.lookDy = 0; };
lookZone.addEventListener('touchend', e => {
  for (const t of e.changedTouches) { if (t.identifier === lookId) resetLook(); }
});
lookZone.addEventListener('touchcancel', resetLook);

// 跳跃按钮
const btnJump = document.getElementById('btn-jump');
btnJump.addEventListener('touchstart', () => { touchState.jump = true; });
btnJump.addEventListener('touchend', () => { touchState.jump = false; });

function updatePhysics(dt) {
  if (inPomoSpace) return;
  if (inDungeon) return;

  // --- 触摸视角（移动端） ---
  if (isTouchDevice && (Math.abs(touchState.lookDx) > 0.5 || Math.abs(touchState.lookDy) > 0.5)) {
    yaw -= touchState.lookDx * 0.003;
    pitch -= touchState.lookDy * 0.003;
    pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
    touchState.lookDx *= 0.7; // 惯性衰减
    touchState.lookDy *= 0.7;
  }

  // --- 手柄视角 ---
  const gp = parentGamepad;
  if (gp?.axes?.length >= 4) {
    const rx = gp.axes[2] || 0, ry = gp.axes[3] || 0;
    if (Math.abs(rx) > 0.15) yaw -= rx * GAMEPAD_SENSITIVITY * dt;
    if (Math.abs(ry) > 0.15) pitch = Math.max(-Math.PI/2+0.01, Math.min(Math.PI/2-0.01, pitch - ry * GAMEPAD_SENSITIVITY * dt));
  } else if (gamepadIndex >= 0) {
    const g = navigator.getGamepads()[gamepadIndex];
    if (g) {
      const rx = g.axes[2] || 0, ry = g.axes[3] || 0;
      if (Math.abs(rx) > 0.15) yaw -= rx * GAMEPAD_SENSITIVITY * dt;
      if (Math.abs(ry) > 0.15) pitch = Math.max(-Math.PI/2+0.01, Math.min(Math.PI/2-0.01, pitch - ry * GAMEPAD_SENSITIVITY * dt));
    }
  }

  // --- 水平移动 (WASD / 触摸摇杆) ---
  let mx = touchState.mx, mz = touchState.mz; // 触摸优先
  if (keys['w'] || keys['arrowup']) mz += 1;
  if (keys['s'] || keys['arrowdown']) mz -= 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;

  // 手柄移动
  if (gp?.axes?.length >= 2) {
    const lx = gp.axes[0] || 0, ly = gp.axes[1] || 0;
    if (Math.abs(lx) > 0.15) mx += lx;
    if (Math.abs(ly) > 0.15) mz += ly;
  } else if (gamepadIndex >= 0) {
    const g = navigator.getGamepads()[gamepadIndex];
    if (g) {
      if (Math.abs(g.axes[0]) > 0.15) mx += g.axes[0];
      if (Math.abs(g.axes[1]) > 0.15) mz += g.axes[1];
    }
  }

  const len = Math.sqrt(mx * mx + mz * mz);
  if (len > 1) { mx /= len; mz /= len; }
  isMoving = len > 0.1;

  // 疾跑检测：双击W（500ms内连续按两次）
  if (justPressed['w'] || justPressed['arrowup']) {
    const now = performance.now();
    if (now - lastWPressTime < 500 && len > 0.1) {
      isSprinting = !isSprinting;
      showBubble(isSprinting ? '🏃 疾跑模式' : '🚶 步行模式');
    }
    lastWPressTime = now;
  }
  // 放开W后松开疾跑
  if (!keys['w'] && !keys['arrowup'] && len < 0.1) {
    isSprinting = false;
  }

  // 水平速度 = 移动输入 × 方向
  const speed = isSprinting ? SPRINT_SPEED : MOVE_SPEED;
  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();

  // mz: 正=前进(W), 负=后退(S); mx: 正=右(D), 负=左(A)
  playerVelocity.x = forward.x * mz * speed + right.x * mx * speed;
  playerVelocity.z = forward.z * mz * speed + right.z * mx * speed;

  // --- 跳跃 ---
  if ((justPressed[' '] || touchState.jump) && playerOnGround) {
    playerVelocity.y = JUMP_VELOCITY;
    playerOnGround = false;
    touchState.jump = false; // 只跳一次
  }

  // --- 重力 ---
  playerVelocity.y -= GRAVITY * dt;

  // --- 位置更新 (分轴碰撞检测) ---
  // Y轴
  playerPos.y += playerVelocity.y * dt;
  const groundH = sampleTerrainHeight(playerPos.x, playerPos.z);
  if (playerPos.y <= groundH) {
    playerPos.y = groundH;
    playerVelocity.y = 0;
    playerOnGround = true;
  } else {
    playerOnGround = false;
  }

  // XZ轴
  playerPos.x += playerVelocity.x * dt;
  playerPos.z += playerVelocity.z * dt;

  // 碰撞检测 (建筑/树)
  for (const col of colliders) {
    const dx = playerPos.x - col.pos.x, dz = playerPos.z - col.pos.z;
    const d = Math.sqrt(dx * dx + dz * dz), min = PLAYER_RADIUS + col.radius;
    if (d < min && d > 0.001) {
      const push = (min - d) / d;
      playerPos.x += dx * push;
      playerPos.z += dz * push;
    }
  }

  // 检查是否还在陆地上（掉海里就重置）
  if (playerPos.y < -8) {
    playerPos.set(0, 3, 0);
    playerVelocity.set(0, 0, 0);
    playerOnGround = true;
  }

  // --- 更新相机 (第一人称，眼睛位置 = 脚底 + 眼高) ---
  const eyeY = playerPos.y + PLAYER_HEIGHT;
  camera.position.set(playerPos.x, eyeY, playerPos.z);

  // HUD 模式提示
  const hint = document.getElementById('controls-hint');
  if (inPomoSpace) hint.textContent = '🍅 番茄钟 · 鼠标旋转 · 滚轮缩放 · B退出';
  else if (isSprinting) hint.textContent = '🏃 疾跑中 · 双击W切换';
  else hint.textContent = 'WASD移动 · 鼠标视角 · 空格跳跃 · 双击W疾跑';

  // 视角方向
  const lookDir = new THREE.Vector3(
    -Math.sin(yaw) * Math.cos(pitch),
    Math.sin(pitch),
    -Math.cos(yaw) * Math.cos(pitch)
  );
  camera.lookAt(camera.position.clone().add(lookDir));

  // --- 更新企鹅位置 (隐藏的企鹅，用于交互判定) ---
  penguinPos.copy(playerPos);
  penguinPos.y += 0.1; // 脚底偏移

  // 更新地图块
  updateChunks(playerPos);

  // 清除单帧按键
  justPressed = {};
}

// 废弃的旧函数（保持兼容）
function getInputVector() {
  let x = 0, z = 0;
  if (keys['w'] || keys['arrowup']) z -= 1;
  if (keys['s'] || keys['arrowdown']) z += 1;
  if (keys['a'] || keys['arrowleft']) x -= 1;
  if (keys['d'] || keys['arrowright']) x += 1;
  const len = Math.sqrt(x*x+z*z);
  if (len > 1) { x /= len; z /= len; }
  return { x, z, active: len > 0.1 };
}
function updatePenguin(dt) {
  if (inDungeon) return;
  isMoving = getInputVector().active;
  penguinGroup.position.copy(playerPos);
  penguinGroup.position.y = playerPos.y + 0.1;
  penguinGroup.visible = false; // 第一人称：隐藏企鹅模型
}

// ═══════════════════ 交互 ═══════════════════
function registerInteractable(pos, range, label, action, radius, topY) {
  interactables.push({ pos: pos.clone(), range, label, action, radius: radius || 0.6, topY: topY || 1 });
}
function registerCollider(pos, radius) { colliders.push({ pos: pos.clone(), radius }); }
function getBubblePos(obj) { return obj ? new THREE.Vector3(obj.pos.x, obj.topY, obj.pos.z) : new THREE.Vector3(penguinPos.x, 1, penguinPos.z); }

let currentInteractable = null;
const interactEl = document.getElementById('interact-prompt');
const raycaster = new THREE.Raycaster();
raycaster.far = 200; // 交互距离 — 树可能很远

function updateInteractions() {
  if (inDungeon || inPomoSpace) return;
  const eyePos = camera.position;

  // 找到距离内最近的可交互物，按各自 range 判断
  let nearest = null, nd = Infinity;

  for (const obj of interactables) {
    const d = eyePos.distanceTo(obj.pos);
    // 树用 10 单位，其他用各自的 range
    const maxDist = obj.isTree ? 10 : obj.range;
    if (d < maxDist && d < nd) {
      nearest = obj;
      nd = d;
    }
  }

  currentInteractable = nearest;
  if (currentInteractable) {
    interactEl.textContent = `🖱️ Enter ${currentInteractable.label}`;
    interactEl.style.opacity = '1';
  } else {
    interactEl.style.opacity = '0';
  }
}
function doInteract() { if (inDungeon) return; console.log('[Interact] currentInteractable:', currentInteractable?.label); if (currentInteractable) currentInteractable.action(); else showBubble('准星对准可互动的物体~', null); }

// ═══════════════════ 树详情面板 ═══════════════════
function openTreeDetail(t) {
  const el = document.getElementById('tree-detail');
  document.getElementById('tree-detail-status').textContent =
    t.status === 'completed' ? '✅ 已完成' : (t.status === 'in_progress' ? '🔨 进行中' : '⏳ 待办');
  document.getElementById('tree-detail-title').textContent = t.title || '未命名任务';

  const desc = t.description || '';
  document.getElementById('tree-detail-desc').textContent = desc || '暂无描述';

  // 元数据
  const meta = document.getElementById('tree-detail-meta');
  meta.innerHTML = '';

  const priorityLabel = { high: '🔥 高', medium: '⚡ 中', low: '🌱 低' };
  meta.appendChild(makeMetaItem('优先级', priorityLabel[t.priority] || t.priority || '-'));

  if (t.due) meta.appendChild(makeMetaItem('截止', t.due));

  const created = t.created_at ? new Date(t.created_at).toLocaleDateString('zh-CN') : '-';
  meta.appendChild(makeMetaItem('创建', created));

  if (t.completed_at) {
    const done = new Date(t.completed_at).toLocaleDateString('zh-CN');
    meta.appendChild(makeMetaItem('完成', done));
  }

  // Metadata 里的额外信息
  const md = t.metadata || {};
  if (md.pomo_count != null) meta.appendChild(makeMetaItem('🍅 番茄钟', `${md.pomo_done || 0}/${md.pomo_count}`));
  if (md.notes) meta.appendChild(makeMetaItem('📝 笔记', md.notes));

  if (t.tags && t.tags.length > 0) {
    meta.appendChild(makeMetaItem('🏷️', t.tags.join(', ')));
  }

  // 操作按钮
  const actions = document.getElementById('tree-detail-actions');
  actions.innerHTML = '';

  if (t.status === 'pending') {
    const btn = document.createElement('button');
    btn.className = 'btn-start';
    btn.textContent = '▶ 开始';
    btn.onclick = () => { apiUpdateTodo(t.id, { status: 'in_progress' }); closeTreeDetail(); };
    actions.appendChild(btn);
  }
  if (t.status === 'in_progress') {
    const btn = document.createElement('button');
    btn.className = 'btn-complete';
    btn.textContent = '✅ 完成';
    btn.onclick = () => { apiUpdateTodo(t.id, { status: 'completed' }); closeTreeDetail(); };
    actions.appendChild(btn);
    const btn2 = document.createElement('button');
    btn2.className = 'btn-pending';
    btn2.textContent = '⏸ 暂停';
    btn2.onclick = () => { apiUpdateTodo(t.id, { status: 'pending' }); closeTreeDetail(); };
    actions.appendChild(btn2);
  }
  if (t.status === 'completed') {
    const btn = document.createElement('button');
    btn.className = 'btn-start';
    btn.textContent = '🔄 重新开始';
    btn.onclick = () => { apiUpdateTodo(t.id, { status: 'in_progress' }); closeTreeDetail(); };
    actions.appendChild(btn);
  }

  el.classList.add('show');
}

function closeTreeDetail() {
  document.getElementById('tree-detail').classList.remove('show');
}

function makeMetaItem(label, value) {
  const div = document.createElement('div');
  div.className = 'meta-item';
  div.innerHTML = `<span class="label">${label}</span>${value}`;
  return div;
}

// ═══════════════════ 能量塔（Torus Knot） ═══════════════════
let towerGroup = null, towerGlowMesh = null;
function createEnergyTower() {
  towerGroup = new THREE.Group();
  const knotData = createFractalTree(42, 3, 2, 200);
  const knotGeo = new THREE.BufferGeometry();
  knotGeo.setAttribute('position', new THREE.BufferAttribute(knotData.positions, 3));
  knotGeo.setAttribute('color', new THREE.BufferAttribute(knotData.colors, 3));
  knotGeo.setIndex(new THREE.BufferAttribute(knotData.indices, 1));
  knotGeo.computeVertexNormals();
  const knotMesh = new THREE.Mesh(knotGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.3, metalness: 0.6 }));
  knotMesh.castShadow = true;
  knotMesh.scale.setScalar(2.5);
  towerGroup.add(knotMesh);

  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.8 }));
  glow.position.y = 2;
  towerGroup.add(glow);
  towerGlowMesh = glow;

  towerGroup.position.set(0, 0, 0);
  scene.add(towerGroup);
  registerInteractable(new THREE.Vector3(0, 0, 0), 3, '🍅 番茄钟能量塔', () => {
    if (pomoState.active) {
      if (pomoState.state === 'work') showBubble(`专注中 🔴 ${Math.floor(pomoState.remaining / 60)}:${(pomoState.remaining % 60).toString().padStart(2, '0')}`, getBubblePos(currentInteractable));
      else showBubble(`休息中 🟢 ${Math.floor(pomoState.remaining / 60)}:${(pomoState.remaining % 60).toString().padStart(2, '0')}`, getBubblePos(currentInteractable));
    } else showBubble('进入建筑开始番茄钟吧~', getBubblePos(currentInteractable));
  }, 1, 3);
  registerCollider(new THREE.Vector3(0, 0, 0), 1);
}
createEnergyTower();
createPortal();

// ═══════════════════ 分形星系传送门 ═══════════════════
function createPortal() {
  portalGroup = new THREE.Group();

  // 中心太阳 — 纯白核心 + 蓝紫光晕
  const coreGeo = new THREE.SphereGeometry(0.5, 32, 32);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const core = new THREE.Mesh(coreGeo, coreMat);
  portalGroup.add(core);

  // 内层光晕 — 统一蓝紫渐变
  const haloColors = [0x8899ff, 0x7766cc, 0x5544aa];
  for (let i = 0; i < 3; i++) {
    const halo = new THREE.Mesh(
      new THREE.SphereGeometry(0.6 + i * 0.35, 32, 32),
      new THREE.MeshBasicMaterial({ color: haloColors[i], transparent: true, opacity: 0.18 - i * 0.05, depthWrite: false })
    );
    halo.userData.haloIdx = i;
    portalGroup.add(halo);
    portalRings.push(halo);
  }

  // 对数螺旋臂 — 4条臂，统一蓝白渐变
  const armBaseHue = 0.62; // 蓝紫色相
  for (let a = 0; a < 4; a++) {
    const baseAngle = (a / 4) * Math.PI * 2;
    const armGroup = new THREE.Group();
    const armPts = [];
    const armCount = 200;
    for (let i = 0; i < armCount; i++) {
      const t = i / armCount;
      const r = 0.8 + t * 5.5;
      const spiral = t * Math.PI * 6;
      const angle = baseAngle + spiral;
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r;
      const y = (t - 0.5) * 2.5;
      armPts.push(x, y, z);
    }

    // 臂上的发光节点 — 蓝→白渐变
    const nodeCount = 80;
    for (let i = 0; i < nodeCount; i++) {
      const t = i / nodeCount;
      const idx = Math.floor(t * (armCount - 1));
      const px = armPts[idx * 3], py = armPts[idx * 3 + 1] + (Math.random() - 0.5) * 0.3, pz = armPts[idx * 3 + 2];
      const nodeGeo = new THREE.SphereGeometry(0.04 + Math.random() * 0.08, 6, 6);
      // 内侧蓝紫，外侧淡蓝白
      const hue = armBaseHue - t * 0.08;
      const sat = 0.3 + t * 0.3;
      const light = 0.5 + t * 0.45;
      const nc = new THREE.Color().setHSL(hue, sat, light);
      const nodeMat = new THREE.MeshBasicMaterial({ color: nc, transparent: true, opacity: 0.4 + Math.random() * 0.4 });
      const node = new THREE.Mesh(nodeGeo, nodeMat);
      node.position.set(px, py, pz);
      node.userData.basePos = { x: px, y: py, z: pz };
      node.userData.phase = Math.random() * Math.PI * 2;
      armGroup.add(node);
    }
    portalGroup.add(armGroup);
    armGroup.userData.isArm = true;
    armGroup.userData.baseAngle = baseAngle;
    portalRings.push(armGroup);
  }

  // 环绕粒子环 — 蓝白星空感
  const ppCount = 600;
  const ppGeo = new THREE.BufferGeometry();
  const ppPositions = new Float32Array(ppCount * 3);
  const ppColors = new Float32Array(ppCount * 3);
  for (let i = 0; i < ppCount; i++) {
    const phi = Math.random() * Math.PI * 2;
    const theta = Math.random() * Math.PI;
    const r = 2.5 + Math.random() * 3.5;
    ppPositions[i * 3] = Math.sin(theta) * Math.cos(phi) * r;
    ppPositions[i * 3 + 1] = Math.sin(theta) * Math.sin(phi) * r;
    ppPositions[i * 3 + 2] = Math.cos(theta) * r;
    // 蓝白星空：色相 0.58-0.65，低饱和，高亮度
    const c = new THREE.Color().setHSL(0.58 + Math.random() * 0.07, 0.15 + Math.random() * 0.25, 0.65 + Math.random() * 0.35);
    ppColors[i * 3] = c.r; ppColors[i * 3 + 1] = c.g; ppColors[i * 3 + 2] = c.b;
  }
  ppGeo.setAttribute('position', new THREE.BufferAttribute(ppPositions, 3));
  ppGeo.setAttribute('color', new THREE.BufferAttribute(ppColors, 3));
  const ppMat = new THREE.PointsMaterial({ size: 0.05, vertexColors: true, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending });
  portalParticles = new THREE.Points(ppGeo, ppMat);
  portalGroup.add(portalParticles);

  // 门框 — Torus Knot，银蓝半透明
  for (let i = 0; i < 2; i++) {
    const tkGeo = new THREE.TorusKnotGeometry(2.8, 0.06, 120, 8, 2, 3);
    const tkMat = new THREE.MeshBasicMaterial({ color: i === 0 ? 0x8899cc : 0x9988bb, transparent: true, opacity: 0.35 });
    const tk = new THREE.Mesh(tkGeo, tkMat);
    tk.rotation.x = Math.PI / 2;
    tk.rotation.z = i * Math.PI / 2;
    tk.userData.rotSpeed = (i === 0 ? 0.3 : -0.25);
    portalGroup.add(tk);
    portalRings.push(tk);
  }

  portalGroup.position.set(5, 3, 0);
  scene.add(portalGroup);

  // 碰撞体
  registerCollider(new THREE.Vector3(5, 3, 0), 2.8);
}

function updatePortal(dt) {
  if (!portalGroup) return;
  portalGroup.rotation.y += dt * 0.15;

  // 光晕脉动
  for (const ring of portalRings) {
    if (ring.userData.haloIdx != null) {
      const s = 0.9 + Math.sin(elapsed * 2 + ring.userData.haloIdx) * 0.1;
      ring.scale.setScalar(s);
      ring.material.opacity = 0.2 + Math.sin(elapsed * 1.5 + ring.userData.haloIdx * 2) * 0.08;
    }
    // Torus Knot 旋转
    if (ring.userData.rotSpeed) {
      ring.rotation.z += dt * ring.userData.rotSpeed;
      ring.rotation.x += dt * ring.userData.rotSpeed * 0.5;
    }
    // 螺旋臂自转
    if (ring.userData.isArm) {
      ring.rotation.y += dt * 0.2;
    }
  }

  // 粒子环绕
  if (portalParticles) {
    portalParticles.rotation.y += dt * 0.25;
    portalParticles.rotation.x += dt * 0.1;
  }
}

// ═══════════════════ 传送门任务选择面板 ═══════════════════
let portalSelectedIdx = 0;
let portalCardIds = [];

function showPortalPanel() {
  const panel = document.getElementById('portal-panel');
  document.body.insertBefore(panel, document.body.firstChild);
  const content = document.getElementById('portal-panel-content');
  const pending = todos.filter(t => t.status === 'pending').slice(0, 5);
  const active = todos.filter(t => t.status === 'in_progress').slice(0, 5);
  const cards = [];
  for (const t of active) cards.push({ task: t, icon: '🔨', cls: 'in_progress' });
  for (const t of pending) cards.push({ task: t, icon: '⏳', cls: 'pending' });

  portalCardIds = cards.map(c => c.task.id);
  portalSelectedIdx = 0;

  let html = '';
  if (cards.length === 0) {
    html = '<div style="color:rgba(255,255,255,0.5);text-align:center;padding:40px">还没有任务哦~<br>先去任务列表创建一个吧！</div>';
  } else {
    html = cards.map((c, i) => `
      <div class="portal-task-card ${c.cls}${i === 0 ? ' focused' : ''}" data-idx="${i}" data-id="${c.task.id}">
        <div class="card-icon">${c.icon}</div>
        <div class="card-title">${c.task.title || '未命名'}</div>
        <div class="card-meta">${c.task.pomo_done || 0}/${c.task.pomo_count || 0} 🍅</div>
      </div>
    `).join('');
  }
  content.innerHTML = '<div id="portal-panel-close" onclick="hidePortalPanel()">✕ 关闭</div>' + html;
  panel.classList.add('show');
  panel.style.setProperty('display', 'flex', 'important');
  panel.style.setProperty('width', window.innerWidth + 'px', 'important');
  panel.style.setProperty('height', window.innerHeight + 'px', 'important');
  const bg = document.getElementById('portal-panel-bg');
  if (bg) { bg.style.setProperty('display', 'block', 'important'); bg.style.setProperty('background', 'rgba(0,0,0,0.7)', 'important'); }
  // 去掉调试红框
  panel.style.removeProperty('border');
  showBubble('选择要专注的任务吧~', new THREE.Vector3(0, 4, 0));
}

function updatePortalFocus() {
  const cards = document.querySelectorAll('.portal-task-card');
  cards.forEach((c, i) => {
    c.classList.toggle('focused', i === portalSelectedIdx);
  });
}

function hidePortalPanel() {
  const panel = document.getElementById('portal-panel');
  panel.classList.remove('show');
  panel.style.removeProperty('display');
  panel.style.removeProperty('width');
  panel.style.removeProperty('height');
  portalSelectedIdx = 0;
  portalCardIds = [];
}

window.selectPortalTask = function(taskId) {
  hidePortalPanel();
  const task = todos.find(t => t.id === taskId);
  if (task) enterPomoSpace(task);
};

window.hidePortalPanel = hidePortalPanel;

// ═══════════════════ 三维番茄钟空间 ═══════════════════
function enterPomoSpace(task) {
  if (inPomoSpace) return;
  inPomoSpace = true;
  pomoSpaceTask = task;
  pomoNotes = [];

  // 通知父页面：企鹅岛内部番茄钟已启动（不触发父页面模式选择）
  window.parent.postMessage({ type: 'islandAction', action: { type: 'pomoSpaceEnter', taskId: task.id } }, '*');

  // 创建场景组
  pomoSpaceGroup = new THREE.Group();
  pomoSpaceGroup.position.set(0, 0, 0);

  // --- 星空球 ---
  const starCount = 2000;
  const starGeo = new THREE.BufferGeometry();
  const starPositions = new Float32Array(starCount * 3);
  const starColors = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const phi = Math.acos(2 * Math.random() - 1);
    const theta = Math.random() * Math.PI * 2;
    const r = 15 + Math.random() * 20;
    starPositions[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
    starPositions[i * 3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
    starPositions[i * 3 + 2] = Math.cos(phi) * r;
    const c = new THREE.Color().setHSL(Math.random(), 0.3, 0.5 + Math.random() * 0.5);
    starColors[i * 3] = c.r; starColors[i * 3 + 1] = c.g; starColors[i * 3 + 2] = c.b;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
  const starMat = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 0.8, depthWrite: false });
  pomoSpaceStarField = new THREE.Points(starGeo, starMat);
  pomoSpaceGroup.add(pomoSpaceStarField);

  // --- 计时球体（中央） ---
  const orbGroup = new THREE.Group();
  // 核心发光球
  const orbCore = new THREE.Mesh(
    new THREE.SphereGeometry(0.8, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.9 })
  );
  orbGroup.add(orbCore);
  // 多层半透明外壳
  for (let i = 0; i < 3; i++) {
    const shell = new THREE.Mesh(
      new THREE.SphereGeometry(0.9 + i * 0.3, 24, 24),
      new THREE.MeshBasicMaterial({ color: [0x4488ff, 0x8844ff, 0x44aaff][i], transparent: true, opacity: 0.2 - i * 0.05, depthWrite: false, wireframe: i === 2 })
    );
    shell.userData.shellIdx = i;
    orbGroup.add(shell);
    pomoSpaceRingRings.push(shell);
  }
  // 分形环轨道
  for (let i = 0; i < 3; i++) {
    const ringGeo = new THREE.TorusGeometry(1.5 + i * 0.8, 0.03, 16, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: [0x4488ff, 0x8844ff, 0x44ff88][i], transparent: true, opacity: 0.6 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 3 + i * 0.5;
    ring.rotation.y = i * 0.7;
    ring.userData.ringIdx = i;
    orbGroup.add(ring);
    pomoSpaceRingRings.push(ring);
  }
  orbGroup.position.y = 3;
  pomoSpaceGroup.add(orbGroup);
  pomoSpaceTimerOrb = orbGroup;

  // --- 进度螺旋塔 ---
  const towerGroup = new THREE.Group();
  const towerH = 6;
  const towerSegs = 40;
  const towerPts = [];
  for (let i = 0; i < towerSegs; i++) {
    const t = i / towerSegs;
    const angle = t * Math.PI * 6;
    const r = 0.6 + t * 0.3;
    towerPts.push(Math.cos(angle) * r, t * towerH, Math.sin(angle) * r);
  }
  // 管状螺旋
  const towerGeo = new THREE.BufferGeometry();
  const twPositions = [], twIndices = [];
  const twSides = 6;
  for (let si = 0; si < towerSegs - 1; si++) {
    const x1 = towerPts[si * 3], y1 = towerPts[si * 3 + 1], z1 = towerPts[si * 3 + 2];
    const x2 = towerPts[(si + 1) * 3], y2 = towerPts[(si + 1) * 3 + 1], z2 = towerPts[(si + 1) * 3 + 2];
    const dx = x2 - x1, dy = y2 - y1, dz = z2 - z1;
    const dl = Math.sqrt(dx * dx + dz * dz) || 1;
    const nx = -dz / dl, nz = dx / dl;
    const r1 = 0.04 + (1 - si / towerSegs) * 0.06;
    const r2 = 0.04 + (1 - (si + 1) / towerSegs) * 0.06;
    const base = twPositions.length / 3;
    for (let j = 0; j < twSides; j++) {
      const a = (j / twSides) * Math.PI * 2;
      twPositions.push(x1 + nx * Math.cos(a) * r1, y1 + Math.sin(a) * r1, z1 + nz * Math.cos(a) * r1);
    }
    for (let j = 0; j < twSides; j++) {
      const a = (j / twSides) * Math.PI * 2;
      twPositions.push(x2 + nx * Math.cos(a) * r2, y2 + Math.sin(a) * r2, z2 + nz * Math.cos(a) * r2);
    }
    for (let j = 0; j < twSides; j++) {
      const a = base + j, b = base + (j + 1) % twSides;
      const c = base + twSides + j, d = base + twSides + (j + 1) % twSides;
      twIndices.push(a, b, d, a, d, c);
    }
  }
  towerGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(twPositions), 3));
  towerGeo.setIndex(twIndices);
  towerGeo.computeVertexNormals();
  const towerMat = new THREE.MeshStandardMaterial({ color: 0x4488ff, roughness: 0.3, metalness: 0.7, emissive: 0x112244, emissiveIntensity: 0.5 });
  const towerMesh = new THREE.Mesh(towerGeo, towerMat);
  towerGroup.add(towerMesh);
  // 塔顶发光球
  const towerTop = new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0x88ccff, transparent: true, opacity: 0.9 })
  );
  towerTop.position.y = towerH;
  towerGroup.add(towerTop);
  towerGroup.position.set(3, 0, 0);
  towerGroup.visible = false; // 初始隐藏，有进度才显示
  pomoSpaceGroup.add(towerGroup);
  pomoSpaceProgressTower = towerGroup;

  // --- 笔记基座（3个浮动平台） ---
  for (let i = 0; i < 3; i++) {
    const angle = (i / 3) * Math.PI * 2;
    const pedestal = new THREE.Group();
    const platGeo = new THREE.CylinderGeometry(0.4, 0.5, 0.15, 16);
    const platMat = new THREE.MeshStandardMaterial({ color: 0x334466, roughness: 0.5, metalness: 0.4, emissive: 0x112233, emissiveIntensity: 0.3 });
    const plat = new THREE.Mesh(platGeo, platMat);
    pedestal.add(plat);
    // 光柱
    const beamGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.5, 8);
    const beamMat = new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.3 });
    const beam = new THREE.Mesh(beamGeo, beamMat);
    beam.position.y = 0.8;
    pedestal.add(beam);
    pedestal.position.set(Math.cos(angle) * 4, 0.1, Math.sin(angle) * 4);
    pedestal.userData.angle = angle;
    pedestal.userData.beam = beam;
    pomoSpaceGroup.add(pedestal);
    pomoSpaceRingRings.push(pedestal);
  }

  // --- 暂停祭坛（中央下方） ---
  const altarGroup = new THREE.Group();
  const altarGeo = new THREE.CylinderGeometry(0.8, 1, 0.2, 8);
  const altarMat = new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.4, metalness: 0.5, emissive: 0x112233, emissiveIntensity: 0.4 });
  const altar = new THREE.Mesh(altarGeo, altarMat);
  altarGroup.add(altar);
  // 八角光柱
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const pillar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.03, 0.03, 2, 6),
      new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.4 })
    );
    pillar.position.set(Math.cos(a) * 0.9, 1.1, Math.sin(a) * 0.9);
    altarGroup.add(pillar);
    pillar.userData.phase = i;
  }
  altarGroup.position.set(0, 0.1, 0);
  pomoSpaceGroup.add(altarGroup);
  pomoSpaceRingRings.push(altarGroup);

  // --- 粒子系统 ---
  const psCount = 300;
  const psGeo = new THREE.BufferGeometry();
  const psPositions = new Float32Array(psCount * 3);
  for (let i = 0; i < psCount; i++) {
    psPositions[i * 3] = (Math.random() - 0.5) * 10;
    psPositions[i * 3 + 1] = Math.random() * 8;
    psPositions[i * 3 + 2] = (Math.random() - 0.5) * 10;
  }
  psGeo.setAttribute('position', new THREE.BufferAttribute(psPositions, 3));
  const psMat = new THREE.PointsMaterial({ color: 0x4488ff, size: 0.04, transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending });
  pomoSpaceParticles = new THREE.Points(psGeo, psMat);
  pomoSpaceGroup.add(pomoSpaceParticles);

  scene.add(pomoSpaceGroup);

  // 隐藏主世界
  if (penguinGroup) penguinGroup.visible = false;
  for (const [, e] of taskMeshes) e.group.visible = false;
  if (portalGroup) portalGroup.visible = false;

  // 显示 HUD
  document.getElementById('pomo-space-ui').classList.add('active');
  document.getElementById('pomo-space-task').textContent = task.title || '专注';
  document.getElementById('pomo-space-timer').textContent = '25:00';

  // 初始化相机
  pomoSpaceCamAngleH = 0;
  pomoSpaceCamAngleV = 0.4;
  pomoSpaceCamDist = 12;

  // 初始化 BGM
  initPomoBGM();

  showBubble(`进入番茄钟: ${task.title}`, new THREE.Vector3(0, 4, 0));
}

function exitPomoSpace() {
  if (!inPomoSpace) return;
  inPomoSpace = false;
  pomoSpaceTask = null;

  // 通知父页面退出
  window.parent.postMessage({ type: 'islandAction', action: { type: 'pomoSpaceExit' } }, '*');
  if (pomoSpaceGroup) { scene.remove(pomoSpaceGroup); pomoSpaceGroup = null; }
  pomoSpaceStarField = null;
  pomoSpaceTimerOrb = null;
  pomoSpaceRingRings = [];
  pomoSpaceProgressTower = null;
  pomoSpaceParticles = null;
  if (pomoSpaceEnvGroup) { pomoSpaceGroup.remove(pomoSpaceEnvGroup); pomoSpaceEnvGroup = null; }
  pomoSpaceEnvParticles = null;
  pomoNotes = [];

  // 停止 BGM
  pomoBGMStop();
  if (pomoSpaceAudioCtx) {
    pomoSpaceAudioCtx.close().catch(() => {});
    pomoSpaceAudioCtx = null;
  }

  // 恢复主世界
  if (penguinGroup) penguinGroup.visible = true;
  for (const [, e] of taskMeshes) e.group.visible = true;
  if (portalGroup) portalGroup.visible = true;

  document.getElementById('pomo-space-ui').classList.remove('active');

  // 恢复第一人称相机
  const eyeY = playerPos.y + PLAYER_HEIGHT;
  camera.position.set(playerPos.x, eyeY, playerPos.z);
  const lookDir = new THREE.Vector3(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  camera.lookAt(camera.position.clone().add(lookDir));
}

function updatePomoSpace(dt) {
  if (!inPomoSpace || !pomoSpaceGroup) return;

  // 星空旋转
  if (pomoSpaceStarField) {
    pomoSpaceStarField.rotation.y += dt * 0.05;
    pomoSpaceStarField.rotation.x += dt * 0.02;
  }

  // 计时球体脉动
  if (pomoSpaceTimerOrb) {
    pomoSpaceTimerOrb.rotation.y += dt * 0.3;
    const pomo = pomoState;
    const progress = pomo.active && pomo.total > 0 ? (pomo.total - pomo.remaining) / pomo.total : 0;

    // 外壳脉动
    for (const ring of pomoSpaceRingRings) {
      if (ring.userData.shellIdx != null) {
        const s = 0.9 + Math.sin(elapsed * 2 + ring.userData.shellIdx) * 0.1;
        ring.scale.setScalar(s);
      }
      if (ring.userData.ringIdx != null) {
        ring.rotation.z += dt * (0.5 + ring.userData.ringIdx * 0.2);
        ring.material.opacity = 0.4 + Math.sin(elapsed * 1.5 + ring.userData.ringIdx) * 0.2;
      }
      // 笔记基座浮动
      if (ring.userData.angle != null) {
        ring.position.y = 0.1 + Math.sin(elapsed * 1.2 + ring.userData.angle) * 0.3;
        if (ring.userData.beam) {
          ring.userData.beam.material.opacity = 0.2 + Math.sin(elapsed * 2 + ring.userData.angle) * 0.1;
        }
      }
    }

    // 进度塔
    if (pomoSpaceProgressTower) {
      if (progress > 0) {
        pomoSpaceProgressTower.visible = true;
        pomoSpaceProgressTower.scale.y = Math.min(1, progress);
        pomoSpaceProgressTower.rotation.y += dt * (0.3 + progress * 1.5);
      } else {
        pomoSpaceProgressTower.visible = false;
      }
    }

    // 粒子上升
    if (pomoSpaceParticles) {
      const sp = pomoSpaceParticles.geometry.attributes.position;
      for (let i = 0; i < sp.count; i++) {
        let y = sp.getY(i) + dt * (0.3 + progress * 1.5);
        if (y > 8) y = 0;
        sp.setY(i, y);
        const a = Math.atan2(sp.getZ(i), sp.getX(i)) + dt * 0.2;
        const r = Math.sqrt(sp.getX(i) ** 2 + sp.getZ(i) ** 2);
        sp.setX(i, Math.cos(a) * r);
        sp.setZ(i, Math.sin(a) * r);
      }
      sp.needsUpdate = true;
      pomoSpaceParticles.material.color.setHex(pomo.active && pomo.state === 'break' ? 0xff8844 : 0x4488ff);
    }

    // 环境特效动画
    if (pomoSpaceEnvParticles && pomoSpaceEnvGroup) {
      const geo = pomoSpaceEnvParticles.geometry;
      const pos = geo.attributes.position;
      const ud = geo.userData;

      if (ud.vel && ud.count) {
        // 粒子系统（雨/火/叶/溪流）
        if (pomoSpaceEnvParticles instanceof THREE.Points) {
          for (let i = 0; i < ud.count; i++) {
            // 雨滴：下落
            if (ud.vel.length === ud.count) {
              let y = pos.getY(i) - ud.vel[i] * dt;
              if (y < -2) { y = 12; pos.setX(i, (Math.random()-0.5)*20); pos.setZ(i, (Math.random()-0.5)*20); }
              pos.setY(i, y);
            }
            // 粒子3D速度（火/叶/溪流）
            if (ud.vel.length === ud.count * 3) {
              let x = pos.getX(i) + ud.vel[i*3] * dt;
              let y = pos.getY(i) + ud.vel[i*3+1] * dt;
              let z = pos.getZ(i) + ud.vel[i*3+2] * dt;
              if (y > 10) { y = -2; x = (Math.random()-0.5)*10; z = (Math.random()-0.5)*10; }
              if (y < -3) { y = 10; x = (Math.random()-0.5)*16; z = (Math.random()-0.5)*16; }
              if (Math.abs(x) > 10) x = (Math.random()-0.5)*10;
              if (Math.abs(z) > 10) z = (Math.random()-0.5)*10;
              pos.setXYZ(i, x, y, z);
            }
          }
          pos.needsUpdate = true;
        }
        // 波浪面
        if (pomoSpaceEnvParticles instanceof THREE.Mesh && ud.waveTime != null) {
          ud.waveTime += dt;
          const wp = pomoSpaceEnvParticles.geometry.attributes.position;
          for (let i = 0; i < wp.count; i++) {
            const x = wp.getX(i), z = wp.getZ(i);
            wp.setY(i, Math.sin(x * 0.5 + ud.waveTime * 1.2) * 0.3 + Math.cos(z * 0.7 + ud.waveTime * 0.8) * 0.3);
          }
          wp.needsUpdate = true;
        }
      }
    }

    // 场景色调：专注=蓝紫，休息=暖橙
    const targetColor = pomo.active && pomo.state === 'break' ? 0xff8844 : 0x4488ff;
    if (pomoSpaceTimerOrb.children[0]) {
      pomoSpaceTimerOrb.children[0].material.color.lerp(new THREE.Color(targetColor), dt * 2);
    }
  }

  // 第三人称相机
  pomoSpaceCamAngleH += dt * 0.1;
  const cx = Math.cos(pomoSpaceCamAngleH) * pomoSpaceCamDist;
  const cz = Math.sin(pomoSpaceCamAngleH) * pomoSpaceCamDist;
  const cy = Math.sin(pomoSpaceCamAngleV) * pomoSpaceCamDist;
  camera.position.set(cx, 3 + cy, cz);
  camera.lookAt(pomoSpaceCamTarget);

  // 更新 HUD 计时器
  const pomo = pomoState;
  if (pomo.active) {
    const mins = Math.floor(pomo.remaining / 60);
    const secs = pomo.remaining % 60;
    document.getElementById('pomo-space-timer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
    document.getElementById('btn-pomo-pause').textContent = pomo.paused ? '▶️ 继续' : '⏯️ 暂停';
  } else {
    document.getElementById('pomo-space-timer').textContent = '25:00';
    document.getElementById('btn-pomo-pause').textContent = '⏯️ 暂停';
  }

  // 更新 BGM
  updatePomoBGM();
}

// ═══════════════════ 番茄钟操作 ═══════════════════
window.togglePomoPause = function() {
  window.parent.postMessage({ type: 'islandAction', action: { type: 'togglePomo' } }, '*');
};

window.addPomoNote = function() {
  const note = prompt('输入笔记内容：');
  if (note && note.trim()) {
    pomoNotes.push({ text: note.trim(), time: new Date().toLocaleTimeString() });
    showBubble(`📝 笔记已记录 (${pomoNotes.length})`, new THREE.Vector3(0, 4, 0));
    // 在3D空间中显示笔记浮标
    if (pomoSpaceGroup) {
      const angle = (pomoNotes.length % 3) / 3 * Math.PI * 2;
      const noteSprite = makeTextSprite(note.trim().substring(0, 20), { fontSize: 24, color: '#ffdd44', scale: 1.5 });
      noteSprite.position.set(Math.cos(angle) * 4, 2 + pomoNotes.length * 0.5, Math.sin(angle) * 4);
      pomoSpaceGroup.add(noteSprite);
      noteSprite.userData.isNote = true;
    }
  }
};

window.completePomoEarly = function() {
  if (confirm('确定提前完成这个番茄钟吗？')) {
    window.parent.postMessage({ type: 'islandAction', action: { type: 'completePomo' } }, '*');
    // 完成粒子爆发
    spawnCompletionParticles();
  }
};

function spawnCompletionParticles() {
  if (!pomoSpaceGroup) return;
  const burstCount = 500;
  const burstGeo = new THREE.BufferGeometry();
  const burstPositions = new Float32Array(burstCount * 3);
  const burstColors = new Float32Array(burstCount * 3);
  for (let i = 0; i < burstCount; i++) {
    const phi = Math.acos(2 * Math.random() - 1);
    const theta = Math.random() * Math.PI * 2;
    const r = 0.5 + Math.random() * 3;
    burstPositions[i * 3] = Math.sin(phi) * Math.cos(theta) * r;
    burstPositions[i * 3 + 1] = 3 + Math.sin(phi) * Math.sin(theta) * r;
    burstPositions[i * 3 + 2] = Math.cos(phi) * r;
    const c = new THREE.Color().setHSL(0.1 + Math.random() * 0.15, 0.9, 0.5 + Math.random() * 0.5);
    burstColors[i * 3] = c.r; burstColors[i * 3 + 1] = c.g; burstColors[i * 3 + 2] = c.b;
  }
  burstGeo.setAttribute('position', new THREE.BufferAttribute(burstPositions, 3));
  burstGeo.setAttribute('color', new THREE.BufferAttribute(burstColors, 3));
  const burstMat = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 1, depthWrite: false, blending: THREE.AdditiveBlending });
  const burst = new THREE.Points(burstGeo, burstMat);
  burst.userData.life = 3;
  pomoSpaceGroup.add(burst);
  // 自动清理
  const decay = () => {
    burst.userData.life -= 0.016;
    burst.material.opacity = Math.max(0, burst.userData.life / 3);
    if (burst.userData.life <= 0) {
      pomoSpaceGroup.remove(burst);
      burstGeo.dispose();
      burstMat.dispose();
    } else {
      requestAnimationFrame(decay);
    }
  };
  requestAnimationFrame(decay);
}

// ═══════════════════ BGM 合成器 (复刻 app.js 自然音景引擎) ═══════════════════
const BGM_LIST = [
  { id: 'off',    name: '🔇 静音', icon: '🔇' },
  { id: 'rain',   name: '🌧️ 雨声', icon: '🌧️' },
  { id: 'ocean',  name: '🌊 海浪', icon: '🌊' },
  { id: 'fire',   name: '🔥 篝火', icon: '🔥' },
  { id: 'forest', name: '🌲 森林', icon: '🌲' },
  { id: 'stream', name: '💧 溪流', icon: '💧' },
];
let bgmPresetIdx = 0; // 默认静音
let bgmVolume = 0.25;
let pomoBGMNodes = null;
let pomoBGMEventsTimer = null;

// 噪音生成
function createPinkNoiseBuf(ctx, dur) {
  const sr = ctx.sampleRate, len = sr * dur;
  const buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
    for (let i = 0; i < len; i++) {
      const w = Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
      b6=w*0.115926;
    }
  }
  return buf;
}

function createBrownNoiseBuf(ctx, dur) {
  const sr = ctx.sampleRate, len = sr * dur;
  const buf = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let lo = 0;
    for (let i = 0; i < len; i++) {
      d[i] = (lo + 0.02*(Math.random()*2-1)) / 1.02;
      lo = d[i]; d[i] *= 3.5;
    }
  }
  return buf;
}

function createPomoReverb(ctx, dur) {
  const sr = ctx.sampleRate, len = sr * (dur||1.2);
  const imp = ctx.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = imp.getChannelData(ch);
    for (let i = 0; i < len; i++)
      d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.5);
  }
  const c = ctx.createConvolver();
  c.buffer = imp;
  return c;
}

function pomoBGMStart(id) {
  pomoBGMStop();
  if (id === 'off') return;

  if (!pomoSpaceAudioCtx) pomoSpaceAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const ctx = pomoSpaceAudioCtx;
  const master = ctx.createGain();
  master.gain.value = 0;

  let source, events, lfoN=null, flfoN=null;

  switch (id) {
    case 'rain': {
      source = ctx.createBufferSource();
      source.buffer = createPinkNoiseBuf(ctx, 8);
      source.loop = true;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 2500; bp.Q.value = 0.4;
      const rev = createPomoReverb(ctx, 0.8);
      const dry = ctx.createGain(); dry.gain.value = 0.6;
      const wet = ctx.createGain(); wet.gain.value = 0.4;
      source.connect(bp);
      bp.connect(dry).connect(master);
      bp.connect(rev).connect(wet).connect(master);
      events = () => {
        const now = ctx.currentTime;
        for (let i=0; i<8; i++) {
          const t=now+Math.random()*0.5;
          const o=ctx.createOscillator(), g=ctx.createGain();
          o.type='sine'; o.frequency.value=800+Math.random()*4000;
          g.gain.setValueAtTime(0.025, t);
          g.gain.exponentialRampToValueAtTime(0.001, t+0.06);
          o.connect(g).connect(master); o.start(t); o.stop(t+0.07);
        }
      };
      break;
    }
    case 'ocean': {
      source = ctx.createBufferSource();
      source.buffer = createBrownNoiseBuf(ctx, 8);
      source.loop = true;
      const bp = ctx.createBiquadFilter();
      bp.type = 'lowpass'; bp.frequency.value = 600; bp.Q.value = 0.5;
      lfoN = ctx.createOscillator(); lfoN.frequency.value = 0.15;
      const lg = ctx.createGain(); lg.gain.value = 200;
      lfoN.connect(lg).connect(bp.frequency); lfoN.start();
      const rev = createPomoReverb(ctx, 2.5);
      source.connect(bp).connect(rev).connect(master);
      events = () => {
        const now = ctx.currentTime;
        for (let i=0; i<4; i++) {
          const t=now+Math.random()*0.8;
          const o=ctx.createOscillator(), g=ctx.createGain();
          o.type='sine'; o.frequency.value=200+Math.random()*300;
          g.gain.setValueAtTime(0.02, t);
          g.gain.exponentialRampToValueAtTime(0.001, t+0.5);
          o.connect(g).connect(master); o.start(t); o.stop(t+0.6);
        }
      };
      break;
    }
    case 'fire': {
      // 篝火: crackle buffer
      const sr = ctx.sampleRate, len = sr * 4;
      const crackle = ctx.createBuffer(1, len, sr);
      const cd = crackle.getChannelData(0);
      for (let i=0; i<len; i++) {
        if (Math.random() < 0.003) {
          const dur = 0.01 + Math.random()*0.05;
          const amp = 0.3 + Math.random()*0.7;
          for (let j=0; j<dur*sr && i+j<len; j++)
            cd[i+j] = amp * Math.exp(-j/(0.005*sr));
        }
      }
      source = ctx.createBufferSource();
      source.buffer = crackle;
      source.loop = true;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 3000; bp.Q.value = 0.3;
      const rumble = ctx.createBufferSource();
      rumble.buffer = createBrownNoiseBuf(ctx, 8);
      rumble.loop = true;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 200; lp.Q.value = 0.3;
      const rg = ctx.createGain(); rg.gain.value = 0.4;
      rumble.connect(lp).connect(rg).connect(master);
      source.connect(bp).connect(master);
      rumble.start();
      break;
    }
    case 'forest': {
      source = ctx.createBufferSource();
      source.buffer = createPinkNoiseBuf(ctx, 8);
      source.loop = true;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 4500; bp.Q.value = 0.35;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 8000;
      const rev = createPomoReverb(ctx, 2.0);
      source.connect(bp).connect(lp).connect(rev).connect(master);
      events = () => {
        const now = ctx.currentTime;
        for (let i=0; i<5; i++) {
          const t=now+Math.random()*0.6;
          const o=ctx.createOscillator(), g=ctx.createGain();
          o.type='sine'; o.frequency.value=2000+Math.random()*4000;
          const dur=0.02+Math.random()*0.06;
          g.gain.setValueAtTime(0.015, t);
          g.gain.exponentialRampToValueAtTime(0.001, t+dur);
          o.connect(g).connect(master); o.start(t); o.stop(t+dur+0.01);
        }
      };
      break;
    }
    case 'stream': {
      source = ctx.createBufferSource();
      source.buffer = createPinkNoiseBuf(ctx, 8);
      source.loop = true;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 3000; bp.Q.value = 0.4;
      lfoN = ctx.createOscillator(); lfoN.frequency.value = 0.4;
      const lg = ctx.createGain(); lg.gain.value = 800;
      lfoN.connect(lg).connect(bp.frequency); lfoN.start();
      source.connect(bp).connect(master);
      events = () => {
        const now = ctx.currentTime;
        for (let i=0; i<3; i++) {
          const t=now+Math.random()*0.3;
          const o=ctx.createOscillator(), g=ctx.createGain();
          o.frequency.value=3000+Math.random()*2000;
          g.gain.setValueAtTime(0.008, t);
          g.gain.exponentialRampToValueAtTime(0.001, t+0.03);
          o.connect(g).connect(master); o.start(t); o.stop(t+0.04);
        }
      };
      break;
    }
    default:
      source = ctx.createBufferSource();
      source.buffer = createPinkNoiseBuf(ctx, 8);
      source.loop = true;
      source.connect(master);
  }

  master.connect(ctx.destination);
  master.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 1.5);
  source.start();
  pomoBGMNodes = { source, gain: master, lfo: lfoN, filterLfo: flfoN };

  if (events) {
    events();
    pomoBGMEventsTimer = setInterval(events, 2000);
  }
}

function pomoBGMStop() {
  if (pomoBGMEventsTimer) { clearInterval(pomoBGMEventsTimer); pomoBGMEventsTimer = null; }
  if (pomoBGMNodes) {
    try { pomoBGMNodes.source.stop(); } catch(e) {}
    try { if (pomoBGMNodes.lfo) pomoBGMNodes.lfo.stop(); } catch(e) {}
    try { if (pomoBGMNodes.filterLfo) pomoBGMNodes.filterLfo.stop(); } catch(e) {}
    pomoBGMNodes = null;
  }
}

// ═══════════════════ 番茄钟环境特效 ═══════════════════
function setPomoSpaceEnv(bgmId) {
  // 清除旧环境
  if (pomoSpaceEnvGroup) {
    pomoSpaceGroup.remove(pomoSpaceEnvGroup);
    if (pomoSpaceEnvParticles) {
      pomoSpaceEnvParticles.geometry.dispose();
      pomoSpaceEnvParticles.material.dispose();
      pomoSpaceEnvParticles = null;
    }
    pomoSpaceEnvGroup = null;
  }

  if (bgmId === 'off') return;

  const envGroup = new THREE.Group();
  pomoSpaceEnvGroup = envGroup;

  switch (bgmId) {
    case 'rain': {
      // 雨滴粒子
      const count = 800;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const vel = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        pos[i*3] = (Math.random() - 0.5) * 20;
        pos[i*3+1] = 2 + Math.random() * 12;
        pos[i*3+2] = (Math.random() - 0.5) * 20;
        vel[i] = 4 + Math.random() * 8;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.userData = { vel, count };
      const mat = new THREE.PointsMaterial({ color: 0x6688cc, size: 0.06, transparent: true, opacity: 0.6, depthWrite: false });
      const rain = new THREE.Points(geo, mat);
      envGroup.add(rain);
      pomoSpaceEnvParticles = rain;

      // 暗云色调
      pomoSpaceGroup.children.forEach(c => {
        if (c === pomoSpaceStarField) c.material.opacity = 0.3;
      });
      break;
    }
    case 'ocean': {
      // 波浪平面
      const waveGeo = new THREE.PlaneGeometry(30, 30, 40, 40);
      waveGeo.rotateX(-Math.PI / 2);
      const waveMat = new THREE.MeshBasicMaterial({ color: 0x114477, transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false });
      const wave = new THREE.Mesh(waveGeo, waveMat);
      wave.position.y = -2;
      wave.userData.waveTime = 0;
      envGroup.add(wave);
      pomoSpaceEnvParticles = wave;

      // 蓝色调
      pomoSpaceGroup.children.forEach(c => {
        if (c === pomoSpaceStarField) c.material.color = new THREE.Color(0x334488);
      });
      break;
    }
    case 'fire': {
      // 篝火粒子
      const count = 300;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const vel = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        pos[i*3] = (Math.random() - 0.5) * 3;
        pos[i*3+1] = -1 + Math.random() * 2;
        pos[i*3+2] = (Math.random() - 0.5) * 3;
        vel[i*3] = (Math.random() - 0.5) * 0.5;
        vel[i*3+1] = 1 + Math.random() * 3;
        vel[i*3+2] = (Math.random() - 0.5) * 0.5;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.userData = { vel, count };
      const mat = new THREE.PointsMaterial({ color: 0xff6600, size: 0.1, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending });
      const fire = new THREE.Points(geo, mat);
      fire.position.y = -1.5;
      envGroup.add(fire);
      pomoSpaceEnvParticles = fire;

      // 暖光
      pomoSpaceGroup.children.forEach(c => {
        if (c === pomoSpaceStarField) c.material.color = new THREE.Color(0x553322);
      });
      break;
    }
    case 'forest': {
      // 飘落叶子
      const count = 200;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const vel = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        pos[i*3] = (Math.random() - 0.5) * 16;
        pos[i*3+1] = 2 + Math.random() * 12;
        pos[i*3+2] = (Math.random() - 0.5) * 16;
        vel[i*3] = (Math.random() - 0.5) * 0.8;
        vel[i*3+1] = -0.3 - Math.random() * 0.5;
        vel[i*3+2] = (Math.random() - 0.5) * 0.8;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.userData = { vel, count };
      const mat = new THREE.PointsMaterial({ color: 0x44aa44, size: 0.12, transparent: true, opacity: 0.5, depthWrite: false });
      const leaves = new THREE.Points(geo, mat);
      envGroup.add(leaves);
      pomoSpaceEnvParticles = leaves;

      // 绿色调
      pomoSpaceGroup.children.forEach(c => {
        if (c === pomoSpaceStarField) c.material.color = new THREE.Color(0x224422);
      });
      break;
    }
    case 'stream': {
      // 水流粒子
      const count = 400;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const vel = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        pos[i*3] = (Math.random() - 0.5) * 14;
        pos[i*3+1] = -2 + Math.random() * 6;
        pos[i*3+2] = (Math.random() - 0.5) * 14;
        vel[i*3] = (Math.random() - 0.5) * 0.3;
        vel[i*3+1] = (Math.random() - 0.5) * 0.2;
        vel[i*3+2] = 0.5 + Math.random() * 1.5;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.userData = { vel, count };
      const mat = new THREE.PointsMaterial({ color: 0x44ccdd, size: 0.08, transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending });
      const stream = new THREE.Points(geo, mat);
      envGroup.add(stream);
      pomoSpaceEnvParticles = stream;

      // 蓝绿色调
      pomoSpaceGroup.children.forEach(c => {
        if (c === pomoSpaceStarField) c.material.color = new THREE.Color(0x225555);
      });
      break;
    }
  }

  pomoSpaceGroup.add(envGroup);
}

// ═══════════════════ 语音笔记 ═══════════════════
let mediaRecorder = null, audioChunks = [];

function startVoiceNote() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    showBubble('⏹️ 录音结束', new THREE.Vector3(0, 4, 0));
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      pomoNotes.push({ text: '🎙️ 语音笔记', time: new Date().toLocaleTimeString(), audioUrl: url });
      showBubble(`🎙️ 语音笔记已记录 (${pomoNotes.length})`, new THREE.Vector3(0, 4, 0));
      // 3D 空间显示语音标记
      if (pomoSpaceGroup) {
        const angle = (pomoNotes.length % 3) / 3 * Math.PI * 2;
        const sprite = makeTextSprite('🎙️', { fontSize: 36, color: '#ff6644', scale: 0.8 });
        sprite.position.set(Math.cos(angle) * 4, 2 + pomoNotes.length * 0.5, Math.sin(angle) * 4);
        pomoSpaceGroup.add(sprite);
        sprite.userData.isNote = true;
      }
    };
    mediaRecorder.start();
    showBubble('🔴 录音中... 再按 Space 停止', new THREE.Vector3(0, 4, 0));
  }).catch(() => {
    showBubble('⚠️ 无法访问麦克风', new THREE.Vector3(0, 4, 0));
  });
}



function updateEnergyTower() {
  if (!towerGlowMesh) return;
  if (pomoState.state === 'work') {
    towerGlowMesh.material.color.setHex(0xff3333);
    towerGlowMesh.material.opacity = 0.6 + Math.sin(elapsed * 3) * 0.2;
    towerGlowMesh.scale.setScalar(1 + Math.sin(elapsed * 3) * 0.15);
  } else if (pomoState.state === 'break') {
    towerGlowMesh.material.color.setHex(0x33ff66);
    towerGlowMesh.material.opacity = 0.5 + Math.sin(elapsed * 1.5) * 0.1;
    towerGlowMesh.scale.setScalar(1 + Math.sin(elapsed * 1.5) * 0.05);
  } else {
    towerGlowMesh.material.color.setHex(0x4488ff);
    towerGlowMesh.material.opacity = 0.4;
    towerGlowMesh.scale.setScalar(1);
  }
}

// ═══════════════════ 灯塔（Fibonacci 螺旋） ═══════════════════
let lhGroup = null, lighthouseFlame = null;
function createLighthouse() {
  lhGroup = new THREE.Group();
  const fibData = createFractalTree(271, 4, 3, 35);
  const fibGeo = new THREE.BufferGeometry();
  fibGeo.setAttribute('position', new THREE.BufferAttribute(fibData.positions, 3));
  fibGeo.setAttribute('color', new THREE.BufferAttribute(fibData.colors, 3));
  fibGeo.setIndex(new THREE.BufferAttribute(fibData.indices, 1));
  fibGeo.computeVertexNormals();
  const fibMesh = new THREE.Mesh(fibGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.4, metalness: 0.5 }));
  fibMesh.castShadow = true;

// ═══════════════════ 天气同步 ═══════════════════
let currentWeather = 'clear';
let weatherParticles = null; // 雨/雪粒子系统

function createWeatherParticles(type) {
  if (weatherParticles) { scene.remove(weatherParticles); weatherParticles = null; }
  if (type === 'clear' || type === 'cloudy') return;

  const count = type === 'snow' ? 300 : 800;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const range = 40;

  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * range * 2;
    positions[i * 3 + 1] = Math.random() * 25;
    positions[i * 3 + 2] = (Math.random() - 0.5) * range * 2;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const mat = new THREE.PointsMaterial({
    color: type === 'snow' ? 0xffffff : 0x8899cc,
    size: type === 'snow' ? 0.15 : 0.06,
    transparent: true,
    opacity: type === 'snow' ? 0.8 : 0.5,
    depthWrite: false,
  });

  weatherParticles = new THREE.Points(geo, mat);
  weatherParticles._type = type;
  weatherParticles._positions = positions;
  weatherParticles._count = count;
  scene.add(weatherParticles);
}

function updateWeatherParticles(dt, camPos) {
  if (!weatherParticles) return;
  const p = weatherParticles._positions;
  const count = weatherParticles._count;
  const range = 40;
  const speed = weatherParticles._type === 'snow' ? 1.5 : 12;

  for (let i = 0; i < count; i++) {
    p[i * 3 + 1] -= speed * dt;
    if (p[i * 3 + 1] < -2) {
      p[i * 3 + 1] = 22 + Math.random() * 5;
      p[i * 3] = camPos.x + (Math.random() - 0.5) * range * 2;
      p[i * 3 + 2] = camPos.z + (Math.random() - 0.5) * range * 2;
    }
  }
  weatherParticles.geometry.attributes.position.needsUpdate = true;
  weatherParticles.position.set(camPos.x, 0, camPos.z);
}

async function syncWeather() {
  try {
    const res = await apiFetch('/api/weather');
    if (res.error) return;

    const { scene, weather, weatherDesc, temp } = res;
    setScene(scene);
    currentWeather = weather;
    createWeatherParticles(weather);

    // 更新 HUD 天气标签
    const label = document.getElementById('scene-label');
    const weatherIcons = { clear: '☀️', cloudy: '☁️', rain: '🌧️', snow: '❄️', fog: '🌫️' };
    const icon = weatherIcons[weather] || '☀️';
    const sceneNames = { day: '白天', dusk: '黄昏', night: '夜晚', dawn: '黎明' };
    label.textContent = `${icon} ${weatherDesc || weather} · ${temp}°C · ${sceneNames[scene]}`;
  } catch(e) { console.warn('Weather sync failed:', e); }
}

// ═══════════════════ 动画循环 ═══════════════════
const clock = new THREE.Clock();
let elapsed = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsed += dt;

  const gp = parentGamepad;
  if (gp?.buttons?.length >= 4) {
    const bA = gp.buttons[0], bB = gp.buttons[1];
    if (bA && !prevBtnA) { if (inPomoSpace) exitPomoSpace(); else if (inDungeon) exitDungeon(); else doInteract(); }
    if (bB && !prevBtnB) { if (inPomoSpace) exitPomoSpace(); else if (inDungeon) exitDungeon(); else window.parent.postMessage('closePenguinIsland', '*'); }
    prevBtnA = bA; prevBtnB = bB;
  } else if (gamepadIndex >= 0) {
    const g = navigator.getGamepads()[gamepadIndex];
    if (g) {
      const bA = g.buttons[0]?.pressed, bB = g.buttons[1]?.pressed;
      if (bA && !prevBtnA) { if (inPomoSpace) exitPomoSpace(); else if (inDungeon) exitDungeon(); else doInteract(); }
      if (bB && !prevBtnB) { if (inPomoSpace) exitPomoSpace(); else if (inDungeon) exitDungeon(); else window.parent.postMessage('closePenguinIsland', '*'); }
      prevBtnA = bA; prevBtnB = bB;
    }
  }

  skyUniforms.uTime.value = elapsed;

  const sp = particleSystem.geometry.attributes.position;
  if (sp) {
    for (let i = 0; i < PC; i++) {
      let x = sp.getX(i) + pVel[i * 3] + Math.sin(elapsed + i) * 0.003;
      let y = sp.getY(i) + pVel[i * 3 + 1];
      let z = sp.getZ(i) + pVel[i * 3 + 2];
      if (y < -2) { y = 20; x = (Math.random() - 0.5) * 60; z = (Math.random() - 0.5) * 60; }
      sp.setXYZ(i, x, y, z);
    }
    sp.needsUpdate = true;
  }

  if (lighthouseFlame) {
    lighthouseFlame.scale.x = lighthouseFlame.scale.y * (1 + Math.sin(elapsed * 5) * 0.1);
    lighthouseFlame.material.opacity = 0.7 + Math.sin(elapsed * 8) * 0.2;
  }

  updatePhysics(dt);
  updateInteractions();
  updateDungeon(dt);
  updatePortal(dt);
  updatePomoSpace(dt);
  updateEnergyTower();
  updateBubblePosition();

  if (seaMat) {
    seaMat.uniforms.uTime.value = elapsed;
    seaMat.uniforms.uScene.value = skyUniforms.uScene.value;
    seaMat.uniforms.uCamPos.value.copy(camera.position);
  }

  // 天空球 + 海面跟随相机（无限世界）
  skyDome.position.copy(camera.position);
  seaMesh.position.x = camera.position.x;
  seaMesh.position.z = camera.position.z;

  // 天气粒子（雨/雪）
  updateWeatherParticles(dt, camera.position);

  // 云朵
  if (window._clouds) window._clouds.forEach((c, i) => {
    c.position.x += 0.3 * (0.5 + i * 0.15) * dt;
    if (c.position.x > 50) c.position.x = -50;
  });

  // 星空
  if (window._stars && window._stars.mat.opacity > 0) {
    window._stars.mat.size = 0.15 + Math.sin(elapsed * 2) * 0.03;
  }

  // 极光
  if (window._aurora) {
    window._aurora.visible = (currentScene === 'night');
    if (window._aurora.visible) window._aurora.material.uniforms.uTime.value = elapsed;
  }

  // 海鸥
  if (window._gulls) {
    window._gulls.forEach((g, i) => {
      g.position.x += g.userData.vx * dt;
      g.position.z += g.userData.vz * dt;
      g.position.y += Math.sin(elapsed * 1.5 + i * 2) * 0.01;
      const wingAngle = Math.sin(elapsed * 6 + g.userData.wingPhase) * 0.4;
      g.userData.lWing.rotation.z = wingAngle;
      g.userData.rWing.rotation.z = -wingAngle;
      g.rotation.y = Math.atan2(-g.userData.vz, -g.userData.vx);
      if (g.position.x > 35) g.position.x = -35;
      if (g.position.x < -35) g.position.x = 35;
      if (g.position.z > 25) g.position.z = -25;
      if (g.position.z < -25) g.position.z = 25;
    });
  }

  composer.render();
}

// ═══════════════════ 初始化 ═══════════════════
updateHUD();
// 初始场景由天气同步设置，先默认白天，syncWeather 会覆盖
setScene('day');
syncWeather();
// 初始加载区块并计算出生位置（岛屿边缘外，能看见全貌）
updateChunks(new THREE.Vector3(0, 0, 0));
playerPos.set(20, 5, 20);
playerOnGround = false;
// 朝向岛屿中心
yaw = Math.PI * 1.25;
pitch = -0.3;
// 操控提示 8 秒后淡出
setTimeout(() => {
  document.getElementById('controls-hint').style.opacity = '0';
}, 8000);
animate();
connectWS();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>

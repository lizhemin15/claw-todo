<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>企鹅岛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a1a;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:10}
#hud span{color:#fff;font-size:13px;text-shadow:1px 1px 3px #000}
#penguin-bubble{position:fixed;color:#fff;font-size:14px;background:rgba(0,0,0,0.75);padding:6px 14px;border-radius:16px;pointer-events:none;opacity:0;transition:opacity 0.2s;z-index:20;max-width:320px;text-align:center;text-shadow:1px 1px 2px #000}
#penguin-bubble.show{opacity:1}
#interact-prompt{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);color:#fff;font:bold 16px sans-serif;background:rgba(0,0,0,0.75);padding:8px 18px;border-radius:20px;z-index:50;pointer-events:none;opacity:0;transition:opacity 0.15s;text-shadow:1px 1px 2px #000}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:25;pointer-events:none}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.6)}
#crosshair::before{width:2px;height:14px;left:-1px;top:-7px}
#crosshair::after{width:14px;height:2px;left:-7px;top:-1px}
#crosshair .dot{width:2px;height:2px;background:rgba(255,255,255,0.8);position:absolute;left:-1px;top:-1px;border-radius:50%}
#controls-hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.3);font:11px sans-serif;z-index:10;pointer-events:none;transition:opacity 3s}
#task-panel{position:fixed;right:12px;top:50px;width:260px;max-height:70vh;background:rgba(0,0,0,0.8);border-radius:12px;padding:12px;color:#fff;font-size:13px;z-index:30;display:none;overflow-y:auto;border:1px solid rgba(255,255,255,0.1)}
#task-panel.show{display:block}
#task-panel h3{font-size:14px;margin-bottom:8px;opacity:0.7}
.task-item{padding:6px 8px;margin-bottom:4px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.task-item:hover{background:rgba(255,255,255,0.1)}
.task-item.completed{opacity:0.4;text-decoration:line-through}
.task-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.task-dot.pending{background:#888}
.task-dot.in_progress{background:#4ecdc4;box-shadow:0 0 6px #4ecdc4}
.task-dot.completed{background:#6c5ce7}
.task-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dungeon-ui{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}
#dungeon-ui.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
#dungeon-timer{font:bold 72px monospace;color:#fff;text-shadow:0 0 30px rgba(255,100,100,0.5);letter-spacing:4px}
#dungeon-task-name{font:18px sans-serif;color:rgba(255,255,255,0.7);margin-top:8px}
#dungeon-progress{width:300px;height:6px;background:rgba(255,255,255,0.15);border-radius:3px;margin-top:16px;overflow:hidden}
#dungeon-progress-bar{height:100%;background:linear-gradient(90deg,#ff4444,#ff8844);border-radius:3px;transition:width 1s linear;width:0%}
#dungeon-hint{position:fixed;bottom:40px;color:rgba(255,255,255,0.4);font-size:12px}
#dungeon-exit{position:fixed;top:16px;right:16px;color:#fff;font-size:14px;background:rgba(0,0,0,0.5);padding:6px 14px;border-radius:12px;pointer-events:auto;cursor:pointer}
#dungeon-exit:hover{background:rgba(255,255,255,0.2)}
#scene-indicator{position:fixed;top:40px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:11px;z-index:10;pointer-events:none;transition:all 0.5s}
#ws-status{position:fixed;bottom:8px;right:8px;width:8px;height:8px;border-radius:50%;z-index:10;pointer-events:none}
#ws-status.online{background:#4ecdc4;box-shadow:0 0 6px #4ecdc4}
#ws-status.offline{background:#666}
/* 虚拟手柄 — CSS media query 控制：≤1024px（平板竖屏及以下）显示 */
#touch-controls{position:fixed;inset:0;z-index:100;pointer-events:none;display:none}
#touch-controls>*{pointer-events:auto}
@media (max-width:1024px){#touch-controls{display:block}}
#joystick-zone{position:absolute;bottom:40px;left:40px;width:160px;height:160px;pointer-events:auto}
#joystick-base{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.15)}
#joystick-thumb{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.3);top:50%;left:50%;transform:translate(-50%,-50%);transition:background 0.1s}
#joystick-thumb.active{background:rgba(255,255,255,0.35)}
#btn-jump{position:absolute;bottom:60px;right:30px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,0.12);border:3px solid rgba(255,255,255,0.25);pointer-events:auto;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);font:bold 18px sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#btn-jump:active{background:rgba(255,255,255,0.3)}
#touch-look-zone{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:auto;touch-action:none;z-index:0}
#joystick-zone{z-index:1}
#btn-jump{z-index:1}
/* 任务详情面板 */
#tree-detail{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center}
#tree-detail.show{display:flex}
#tree-detail-bg{position:absolute;inset:0;background:rgba(0,0,0,0.6)}
#tree-detail-card{position:relative;background:rgba(20,20,40,0.95);border:1px solid rgba(255,255,255,0.15);border-radius:16px;padding:24px;max-width:420px;width:90%;max-height:80vh;overflow-y:auto;color:#fff;box-shadow:0 8px 40px rgba(0,0,0,0.5)}
#tree-detail-close{position:absolute;top:12px;right:14px;font-size:20px;cursor:pointer;opacity:0.6;transition:opacity 0.15s}
#tree-detail-close:hover{opacity:1}
#tree-detail-status{font-size:13px;margin-bottom:6px;opacity:0.7}
#tree-detail-title{font-size:20px;margin:0 0 12px;line-height:1.3}
#tree-detail-desc{font-size:14px;opacity:0.7;margin-bottom:16px;line-height:1.5;white-space:pre-wrap}
#tree-detail-meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
#tree-detail-meta .meta-item{background:rgba(255,255,255,0.08);border-radius:8px;padding:6px 12px;font-size:12px}
#tree-detail-meta .meta-item .label{opacity:0.5;margin-right:4px}
#tree-detail-actions{display:flex;gap:8px;flex-wrap:wrap}
#tree-detail-actions button{flex:1;min-width:80px;padding:10px 16px;border:none;border-radius:10px;font:bold 14px sans-serif;cursor:pointer;transition:transform 0.1s,opacity 0.1s}
#tree-detail-actions button:active{transform:scale(0.96)}
#tree-detail-actions .btn-start{background:#4ecdc4;color:#000}
#tree-detail-actions .btn-complete{background:#6c5ce7;color:#fff}
#tree-detail-actions .btn-pending{background:#555;color:#ccc}

/* 传送门任务选择面板 */
#portal-panel{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9999;display:none;align-items:center;justify-content:center}
#portal-panel.show{display:flex;animation:portalIn 0.25s ease}
@keyframes portalIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
#portal-panel-bg{position:absolute;inset:0;background:rgba(0,0,0,0.5)}
#portal-panel-content{position:relative;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:700px;padding:20px;background:rgba(5,5,25,0.95);border:1px solid rgba(100,150,255,0.3);border-radius:16px;box-shadow:0 0 60px rgba(80,120,255,0.15)}
.portal-task-card{background:rgba(10,10,30,0.9);border:1px solid rgba(255,255,255,0.15);border-radius:14px;padding:16px;width:200px;cursor:pointer;transition:all 0.2s;color:#fff;text-align:center}
.portal-task-card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,0.4);box-shadow:0 8px 30px rgba(100,200,255,0.2)}
.portal-task-card .card-icon{font-size:28px;margin-bottom:8px}
.portal-task-card .card-title{font-size:14px;font-weight:bold;margin-bottom:4px;line-height:1.3}
.portal-task-card .card-meta{font-size:11px;opacity:0.5}
.portal-task-card.pending{border-color:rgba(136,136,136,0.3)}
.portal-task-card.in_progress{border-color:rgba(78,205,196,0.5);box-shadow:0 0 20px rgba(78,205,196,0.1)}
.portal-task-card.focused{transform:translateY(-6px);border-color:rgba(255,255,255,0.6)!important;box-shadow:0 0 30px rgba(150,200,255,0.4)!important;outline:2px solid rgba(255,255,255,0.5);outline-offset:4px}
#portal-panel-close{position:absolute;top:-30px;right:0;color:rgba(255,255,255,0.5);font-size:14px;cursor:pointer}
#portal-panel-close:hover{color:#fff}
/* 番茄钟空间 HUD */
#pomo-space-ui{position:fixed;inset:0;pointer-events:none;z-index:9998;display:none}
#pomo-space-ui.active{display:block}
#pomo-space-timer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font:bold 64px monospace;color:#fff;text-shadow:0 0 40px rgba(100,200,255,0.6);letter-spacing:4px}
#pomo-space-task{position:absolute;top:calc(50% + 50px);left:50%;transform:translateX(-50%);font:16px sans-serif;color:rgba(255,255,255,0.6)}
#pomo-space-hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.45);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.key-hint{display:flex;align-items:center;gap:4px;white-space:nowrap}
.key-hint kbd{display:inline-block;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:4px;padding:1px 6px;font:11px monospace;color:rgba(255,255,255,0.7)}
#pomo-space-bgm-name{position:absolute;top:calc(50% + 80px);left:50%;transform:translateX(-50%);font:14px sans-serif;color:rgba(255,255,255,0.5);transition:all 0.3s}
#pomo-space-exit{position:absolute;top:16px;right:16px;color:#fff;font-size:14px;background:rgba(0,0,0,0.5);padding:6px 14px;border-radius:12px;pointer-events:auto;cursor:pointer}
#pomo-space-exit:hover{background:rgba(255,255,255,0.2)}
#pomo-space-actions{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);display:flex;gap:12px;pointer-events:auto}
#pomo-space-actions button{padding:10px 20px;border:none;border-radius:10px;font:bold 14px sans-serif;cursor:pointer;transition:transform 0.1s}
#pomo-space-actions button:active{transform:scale(0.95)}
#pomo-space-actions .btn-pause{background:rgba(255,255,255,0.15);color:#fff}
#pomo-space-actions .btn-complete{background:#6c5ce7;color:#fff}
#pomo-space-actions .btn-note{background:rgba(78,205,196,0.3);color:#fff}
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="hud">
  <span id="penguin-info">🐧 少年 · 😊</span>
  <span id="scene-label">☀️ 白天</span>
  <span id="fish-count">🐟 0</span>
</div>
<div id="scene-indicator"></div>
<div id="penguin-bubble"></div>
<div id="interact-prompt"></div>
<div id="crosshair"><div class="dot"></div></div>
<div id="controls-hint">WASD移动 · 鼠标视角 · 空格跳跃 · Enter交互 · Tab任务</div>
<div id="task-panel"><h3>📋 任务列表</h3><div id="task-list"></div></div>
<div id="dungeon-ui">
  <div id="dungeon-timer">25:00</div>
  <div id="dungeon-task-name"></div>
  <div id="dungeon-progress"><div id="dungeon-progress-bar"></div></div>
  <div id="dungeon-hint">B 退出副本</div>
  <div id="dungeon-exit">✕ 退出</div>
</div>
<!-- 任务详情面板 — 走近树按Enter弹出 -->

    <div id="tree-detail-close" onclick="closeTreeDetail()">✕</div>
    <div id="tree-detail-status"></div>
    <h2 id="tree-detail-title"></h2>
    <div id="tree-detail-desc"></div>
    <div id="tree-detail-meta"></div>
    <div id="tree-detail-actions"></div>
  </div>

<!-- 传送门任务选择面板 -->
<div id="portal-panel">
  <div id="portal-panel-bg" onclick="hidePortalPanel()"></div>
  <div id="portal-panel-content">
    <div id="portal-panel-close" onclick="hidePortalPanel()">✕ 关闭</div>
  </div>
</div>
<!-- 番茄钟空间 HUD -->
<div id="pomo-space-ui">
  <div id="pomo-space-timer">25:00</div>

  <div id="pomo-space-bgm-name"></div>
  <div id="pomo-space-hint">
    <span class="key-hint"><kbd>←→</kbd> BGM</span>
    <span class="key-hint"><kbd>↑↓</kbd> 音量</span>
    <span class="key-hint"><kbd>A</kbd> 录音</span>
    <span class="key-hint"><kbd>⏎</kbd> 暂停</span>
    <span class="key-hint"><kbd>X</kbd> 笔记</span>

    <button class="btn-pause" id="btn-pomo-pause" onclick="togglePomoPause()">⏯️ 暂停</button>
    <button class="btn-note" id="btn-pomo-note" onclick="addPomoNote()">📝 笔记</button>
    <button class="btn-complete" id="btn-pomo-complete" onclick="completePomoEarly()">✅ 完成</button>
  </div>
</div>
</div>
<div id="ws-status" class="offline"></div>
<div id="touch-controls">
  <div id="joystick-zone">
    <div id="joystick-base"></div>
    <div id="joystick-thumb"></div>
  </div>
  <div id="touch-look-zone"></div>
  <div id="btn-jump">跳</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ═══════════════════ 数据源 ═══════════════════
const API_BASE = '';
const token = localStorage.getItem('token') || new URLSearchParams(location.search).get('token') || '';
let ws = null;
let todos = [];
let gameState = { level:1, xp:0, totalPomo:0, todayPomo:0, todayWorkouts:0, todayMeditations:0, combo:0, streak:0 };
let pomoState = { active:false, paused:false, state:'idle', remaining:0, total:0 };

async function apiFetch(path, opts={}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...opts.headers }
  });
  return res.json();
}
async function loadTodos() {
  try { const res = await apiFetch('/api/todos'); todos = res.todos || res || []; syncTaskBuildings(); } catch(e) {}
}
async function loadGameState() {
  try { const res = await apiFetch('/api/game-state'); if (res.state) { gameState = { ...gameState, ...res.state }; updateHUD(); } } catch(e) {}
}
function connectWS() {
  if (!token) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws?token=${token}`);
  ws.onopen = () => { document.getElementById('ws-status').className = 'online'; loadTodos(); loadGameState(); };
  ws.onclose = () => { document.getElementById('ws-status').className = 'offline'; setTimeout(connectWS, 3000); };
  ws.onerror = () => {};
  ws.onmessage = event => {
    try {
      const msg = JSON.parse(event.data);
      if (msg.type === 'todo_created') { todos.unshift(msg.payload); syncTaskBuildings(); }
      else if (msg.type === 'todo_updated') { const idx = todos.findIndex(t => t.id === msg.payload.id); if (idx >= 0) todos[idx] = msg.payload; syncTaskBuildings(); }
      else if (msg.type === 'todo_deleted') { todos = todos.filter(t => t.id !== msg.payload.id); syncTaskBuildings(); }
      else if (msg.type === 'game_state_updated') { if (msg.payload?.state) { gameState = { ...gameState, ...msg.payload.state }; updateHUD(); } }
    } catch(e) {}
  };
}
async function apiUpdateTodo(id, patch) { await apiFetch(`/api/todos/${id}`, { method: 'PATCH', body: JSON.stringify(patch) }); }
async function apiSaveGameState() { await apiFetch('/api/game-state', { method: 'POST', body: JSON.stringify({ state: gameState }) }); }

// ═══════════════════ 分形树系统 ═══════════════════
function pushTriangle(indices, a, b, c) { indices.push(a, b, c); }
function pushQuad(indices, a, b, c, d) { indices.push(a, b, c, a, c, d); }
function hsvToRgb(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
  let rp, gp, bp;
  if (h < 60) [rp, gp, bp] = [c, x, 0];
  else if (h < 120) [rp, gp, bp] = [x, c, 0];
  else if (h < 180) [rp, gp, bp] = [0, c, x];
  else if (h < 240) [rp, gp, bp] = [0, x, c];
  else if (h < 300) [rp, gp, bp] = [x, 0, c];
  else [rp, gp, bp] = [c, 0, x];
  return [rp + m, gp + m, bp + m];
}

// ═══════════════════ 多形态分形树 ═══════════════════
function createFractalTree(seed = 42, iterations = 4, trunkH = 3.0, hue = 120) {
  let s = seed;
  function rnd() { s = (s * 16807 + 0) % 2147483647; return s / 2147483647; }

  const positions = [], indices = [];
  const branchAngle = 1.2 + rnd() * 1.0;    // 69°~126° 大幅张开，像真实的阔叶树
  const branchShrink = 0.55 + rnd() * 0.15; // 子枝更短
  const gravitropism = 0.25 + rnd() * 0.3;  // 更强弯曲
  const canopySize = 0.7 + rnd() * 0.9;     // 更大树冠球

  // 扁六边形叶子（更像真实树叶）
  function addCanopyCluster(cx, cy, cz, radius, count) {
    for (let k = 0; k < count; k++) {
      const theta = rnd() * Math.PI * 2;
      const phi = Math.acos(2 * rnd() - 1);
      const r = radius * (0.3 + rnd() * 0.7);
      const sx = cx + Math.sin(phi) * Math.cos(theta) * r;
      const sy = cy + Math.sin(phi) * Math.sin(theta) * r;
      const sz = cz + Math.cos(phi) * r;
      const sr = radius * (0.12 + rnd() * 0.25);
      // 扁六边形 — 宽而薄，扁在 XZ 平面
      const leafBase = positions.length / 3;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        positions.push(sx + Math.cos(a) * sr, sy + Math.sin(a) * sr * 0.3, sz);
      }
      // 随机轻微旋转
      const rotY = rnd() * Math.PI;
      for (let i = leafBase; i < leafBase + 6; i++) {
        const px = positions[i * 3] - sx, py = positions[i * 3 + 1] - sy, pz = positions[i * 3 + 2] - sz;
        positions[i * 3] = sx + px * Math.cos(rotY) - pz * Math.sin(rotY);
        positions[i * 3 + 2] = sz + px * Math.sin(rotY) + pz * Math.cos(rotY);
      }
      pushTriangle(indices, leafBase, leafBase + 1, leafBase + 2);
      pushTriangle(indices, leafBase, leafBase + 2, leafBase + 3);
      pushTriangle(indices, leafBase, leafBase + 3, leafBase + 4);
      pushTriangle(indices, leafBase, leafBase + 4, leafBase + 5);
    }
  }

  // 递归生长
  function grow(x, y, z, len, radius, angle, tilt, depth, bend) {
    if (depth <= 0 || len < 0.06) {
      addCanopyCluster(x, y, z, canopySize * 0.4, 8 + Math.floor(rnd() * 6));
      return;
    }

    // 弯曲：每段有微小方向偏移
    const bendAngle = bend * gravitropism;
    const actualAngle = angle + bendAngle * 0.3;
    const actualTilt = tilt + bendAngle * 0.2 + (rnd() - 0.5) * 0.15;

    const cosA = Math.cos(actualAngle), sinA = Math.sin(actualAngle);
    const cosT = Math.cos(actualTilt), sinT = Math.sin(actualTilt);
    const dx = sinA * cosT, dz = cosA * cosT, dy = sinT;
    const ex = x + dx * len, ey = y + dy * len, ez = z + dz * len;

    // 管状段（8边形，更圆润）
    const base = positions.length / 3;
    const sides = 8;
    const segs = 3;
    for (let si = 0; si <= segs; si++) {
      const t = si / segs;
      const px = x + dx * len * t, py = y + dy * len * t, pz = z + dz * len * t;
      const rr = radius * (1 - t * 0.25);
      // 法向量计算
      const bx = -dz, by = 0, bz = dx;
      const bl = Math.sqrt(bx * bx + bz * bz) || 1;
      const nx = bx / bl, ny = 0, nz = bz / bl;
      const cx = -nz * dy, cy = nz * dx - nx * dz, cz = nx * dy;
      for (let j = 0; j < sides; j++) {
        const a = (j / sides) * Math.PI * 2;
        positions.push(
          px + (nx * Math.cos(a) + cx * Math.sin(a)) * rr,
          py + (ny * Math.cos(a) + cy * Math.sin(a)) * rr,
          pz + (nz * Math.cos(a) + cz * Math.sin(a)) * rr
        );
      }
    }
    for (let si = 0; si < segs; si++) {
      for (let j = 0; j < sides; j++) {
        const a = base + si * sides + j, b = base + si * sides + (j + 1) % sides;
        const c = base + (si + 1) * sides + j, d = base + (si + 1) * sides + (j + 1) % sides;
        pushQuad(indices, a, b, d, c);
      }
    }

    // 子枝：4-6个，螺旋分布，更茂密
    const childLen = len * branchShrink;
    const childRadius = radius * 0.6;
    const numBranches = depth > 2 ? (4 + Math.floor(rnd() * 3)) : (depth > 1 ? 4 : 3);

    if (numBranches > 0) {
      for (let i = 0; i < numBranches; i++) {
        // 螺旋分布 + 随机偏移
        const phi = (i / numBranches) * Math.PI * 2 + rnd() * 0.5;
        const spread = branchAngle * (0.6 + rnd() * 0.4);
        const childAngle = actualAngle + Math.cos(phi) * spread;
        const childTilt = actualTilt + Math.sin(phi) * spread * 0.7;
        // 末端产生树冠
        const isTerminal = depth <= 2;
        const growLen = isTerminal ? childLen * 0.5 : childLen;
        grow(ex, ey, ez, growLen, childRadius, childAngle, childTilt, depth - 1, bend + (rnd() - 0.5) * 0.3);
      }
    } else {
      // 最外层：直接长树冠
      addCanopyCluster(ex, ey, ez, canopySize * (0.3 + depth * 0.2), 6 + Math.floor(rnd() * 5));
    }
  }

  // 从根部开始，初始向上
  grow(0, 0, 0, trunkH, 0.15, 0, Math.PI / 2, iterations, 0);

  // 顶点颜色
  const vCount = positions.length / 3;
  const colors = new Float32Array(vCount * 3);
  for (let i = 0; i < vCount; i++) {
    const y = positions[i * 3 + 1];
    const yNorm = Math.max(0, Math.min(1, y / (trunkH * 1.4)));
    // 低处=树皮色(棕)，高处=叶色(绿/红/橙)
    const trunkSat = 0.6 - yNorm * 0.3;
    const trunkVal = 0.25 + yNorm * 0.35;
    const h = hue + yNorm * 30 + Math.sin(seed + i * 0.5) * 12;
    const [r, g, b] = hsvToRgb(h, trunkSat, trunkVal);
    colors[i * 3] = r; colors[i * 3 + 1] = g; colors[i * 3 + 2] = b;
  }

  return {
    positions: new Float32Array(positions),
    indices: new Uint32Array(indices),
    colors,
    height: trunkH
  };
}

// 布局用：每个树落在独立的岛屿上，按状态分三个区域
const zoneCounters = { pending: 0, in_progress: 0, completed: 0 };

function getSlotPos(zone, idx) {
  const z = ZONES[zone];
  if (!z) return new THREE.Vector3(0, 0, 0);
  const baseAngle = z.angle;
  // 紧凑排列：间距5，起始3，同状态树聚成小树林
  const chunkDist = idx * 5 + 3;
  const cx = Math.round(Math.cos(baseAngle) * chunkDist);
  const cz = Math.round(Math.sin(baseAngle) * chunkDist);
  const center = getIslandCenter(cx, cz);
  return new THREE.Vector3(center.x, 0, center.z);
}

function syncTaskBuildings() {
  const activeIds = new Set(todos.map(t => t.id));
  for (const [id, e] of taskMeshes) {
    if (!activeIds.has(id)) { scene.remove(e.group); taskMeshes.delete(id); }
  }
  for (const k of Object.keys(zoneCounters)) zoneCounters[k] = 0;
  interactables.length = 0;
  colliders.length = 0;
  registerFixedInteractables();

  todos.forEach(t => {
    const zone = getZone(t);
    const idx = zoneCounters[zone]++;
    const pos = getSlotPos(zone, idx);

    if (taskMeshes.has(t.id)) {
      scene.remove(taskMeshes.get(t.id).group);
    }

    // 每棵树独一无二：用 task.id 的 hash 做种子
    const seed = (t.id || 'task').split('').reduce((a, c) => a + c.charCodeAt(0), 0);
    const isCompleted = t.status === 'completed';
    const isActive = t.status === 'in_progress';
    const isPending = t.status === 'pending';

    // 按状态决定色调：pending=灰绿, in_progress=青色, completed=紫金
    const baseHue = isCompleted ? 280 : (isActive ? 180 : 40);
    const hue = baseHue + (seed % 40) - 20;
    const iterations = isActive ? 5 : (isCompleted ? 4 : 3);
    const trunkH = isActive ? 3.5 : (isCompleted ? 2.5 : 2);

    const treeData = createFractalTree(seed, iterations, trunkH, hue);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(treeData.positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(treeData.colors, 3));
    geo.setIndex(new THREE.BufferAttribute(treeData.indices, 1));
    geo.computeVertexNormals();

    const opacity = isCompleted ? 0.5 : (isPending ? 0.8 : 1.0);

    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.55,
      metalness: 0.05,
      transparent: true,
      opacity,
      emissive: isActive ? 0x226666 : (isCompleted ? 0x221133 : 0x000000),
      emissiveIntensity: isActive ? 0.3 : (isCompleted ? 0.15 : 0),
    });

    const group = new THREE.Group();
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);

    // 进行中光环
    if (isActive) {
      const ringGeo = new THREE.TorusGeometry(0.5, 0.04, 8, 16);
      const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x4ecdc4, transparent: true, opacity: 0.5 }));
      ring.position.y = treeData.height + 0.3;
      ring.rotation.x = Math.PI / 2;
      group.add(ring);
    }

    group.position.copy(pos);
    scene.add(group);

    const baseH = treeData.height;
    taskMeshes.set(t.id, { group, baseH, pos, task: t });

    const actionLabel = t.status === 'completed' ? '✅ 已完成' : '📋 查看详情';
    // 交互球心放在树中间高度，范围覆盖整棵树
    const interactCenter = new THREE.Vector3(pos.x, trunkH * 0.5, pos.z);
    const entry = { pos: interactCenter.clone(), range: trunkH + 2, label: actionLabel, action: () => openTreeDetail(t), radius: 1.5, topY: baseH + 2, isTree: true };
    interactables.push(entry);
    registerCollider(pos, 1);
  });
  console.log(`[树] 同步完成: ${todos.length} 个任务, ${interactables.length} 个可交互对象`);
}

// ═══════════════════ 无限地图系统 ═══════════════════
// Perlin 噪声实现
class PerlinNoise {
  constructor(seed = 42) {
    this.perm = new Uint8Array(512);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    // Fisher-Yates shuffle with seed
    let s = seed;
    for (let i = 255; i > 0; i--) {
      s = (s * 16807 + 0) % 2147483647;
      const j = s % (i + 1);
      [p[i], p[j]] = [p[j], p[i]];
    }
    for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
  }

  grad(hash, x, y) {
    const h = hash & 3;
    const u = h < 2 ? x : y;
    const v = h < 2 ? y : x;
    return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
  }

  noise2D(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const p = this.perm;
    const aa = p[p[X] + Y], ab = p[p[X] + Y + 1];
    const ba = p[p[X + 1] + Y], bb = p[p[X + 1] + Y + 1];
    const x1 = this.grad(aa, xf, yf), x2 = this.grad(ba, xf - 1, yf);
    const y1 = this.grad(ab, xf, yf - 1), y2 = this.grad(bb, xf - 1, yf - 1);
    const lerpX1 = x1 + u * (x2 - x1), lerpX2 = y1 + u * (y2 - y1);
    return lerpX1 + v * (lerpX2 - lerpX1);
  }

  fbm(x, y, octaves = 4, lacunarity = 2.0, gain = 0.5) {
    let val = 0, amp = 1, freq = 1, max = 0;
    for (let i = 0; i < octaves; i++) {
      val += this.noise2D(x * freq, y * freq) * amp;
      max += amp;
      amp *= gain;
      freq *= lacunarity;
    }
    return val / max;
  }
}

const perlin = new PerlinNoise(137);

// 岛屿块管理
const ISLAND_CHUNK_SIZE = 30;
const ISLAND_SPACING = 25;
const VISIBLE_RANGE = 2; // 可见块范围
const loadedChunks = new Map();

function getChunkKey(cx, cz) { return `${cx},${cz}`; }

function getIslandHeight(wx, wz) {
  // 大尺度地形：多个正弦波 + Perlin 噪声
  const base = perlin.fbm(wx * 0.03, wz * 0.03, 4) * 4;
  const detail = perlin.fbm(wx * 0.1, wz * 0.1, 3) * 1.5;
  const ridge = 1 - Math.abs(perlin.noise2D(wx * 0.05 + 100, wz * 0.05 + 100)) * 2;
  return base + detail + ridge * 0.5;
}

function getIslandCenter(chunkX, chunkZ) {
  // 每个块的中心位置由噪声决定
  const cx = chunkX * ISLAND_SPACING + perlin.noise2D(chunkX * 0.7, chunkZ * 0.7) * 5;
  const cz = chunkZ * ISLAND_SPACING + perlin.noise2D(chunkX * 0.7 + 50, chunkZ * 0.7 + 50) * 5;
  return { x: cx, z: cz };
}

function createIslandMesh(cx, cz) {
  // 不创建岛屿网格，树直接长在海面上
  // 只返回位置信息供其他系统使用
  const center = getIslandCenter(cx, cz);
  const group = new THREE.Group();
  group.position.set(center.x, -0.05, center.z);
  scene.add(group);
  return { group, center, radius: 0, height: -0.05 };
}

function getCurrentChunk(wx, wz) {
  return {
    cx: Math.round(wx / ISLAND_SPACING),
    cz: Math.round(wz / ISLAND_SPACING)
  };
}

function updateChunks(penguinWorldPos) {
  const { cx, cz } = getCurrentChunk(penguinWorldPos.x, penguinWorldPos.z);
  const needed = new Set();

  for (let dx = -VISIBLE_RANGE; dx <= VISIBLE_RANGE; dx++) {
    for (let dz = -VISIBLE_RANGE; dz <= VISIBLE_RANGE; dz++) {
      const key = getChunkKey(cx + dx, cz + dz);
      needed.add(key);
      if (!loadedChunks.has(key)) {
        const island = createIslandMesh(cx + dx, cz + dz);
        scene.add(island.group);
        loadedChunks.set(key, island);
      }
    }
  }

  // 卸载远处块
  for (const [key, island] of loadedChunks) {
    if (!needed.has(key)) {
      scene.remove(island.group);
      loadedChunks.delete(key);
    }
  }
}

// ═══════════════════ 文字系统（修复版） ═══════════════════
function makeTextSprite(text, opts = {}) {
  const fontSize = opts.fontSize || 28;
  const maxWidth = opts.maxWidth || 400;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif`;

  // 测量文本实际宽度
  const metrics = ctx.measureText(text);
  const textWidth = metrics.width;
  const padding = fontSize * 0.5;

  // 自适应 Canvas 大小
  const cw = Math.max(128, Math.ceil(textWidth + padding * 2));
  const ch = Math.ceil(fontSize * 1.8);
  c.width = cw;
  c.height = ch;

  // 重新设置（canvas resize 会重置 context）
  ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // 文字阴影
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 4;
  ctx.shadowOffsetX = 1;
  ctx.shadowOffsetY = 1;

  // 描边
  ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.lineWidth = Math.max(2, fontSize * 0.08);
  ctx.strokeText(text, cw / 2, ch / 2);

  // 填充
  ctx.fillStyle = opts.color || '#ffffff';
  ctx.fillText(text, cw / 2, ch / 2);

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false });
  const sprite = new THREE.Sprite(mat);

  // 根据 Canvas 比例设置 scale
  const aspect = cw / ch;
  const baseH = opts.scale || 2;
  sprite.scale.set(baseH * aspect, baseH, 1);
  return sprite;
}

// 木牌子：文字贴图面板 + 木框支架
function createSignBoard(text, opts = {}) {
  const fontSize = 36;
  const maxChars = 14;
  const displayText = text.length > maxChars ? text.slice(0, maxChars) + '…' : text;

  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif`;

  const metrics = ctx.measureText(displayText);
  const textW = metrics.width;
  const pad = fontSize * 0.6;
  const cw = Math.ceil(textW + pad * 2);
  const ch = Math.ceil(fontSize * 1.6);
  c.width = cw;
  c.height = ch;

  // 重新设置
  ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // 背景木板色
  const bgColor = opts.bgColor || '#332211';
  ctx.fillStyle = bgColor;
  roundRect(ctx, 8, 8, cw - 16, ch - 16, 12);
  ctx.fill();

  // 边框
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 3;
  roundRect(ctx, 8, 8, cw - 16, ch - 16, 12);
  ctx.stroke();

  // 文字
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 2;
  ctx.fillStyle = opts.color || '#fff';
  ctx.fillText(displayText, cw / 2, ch / 2);

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;

  const realW = cw / 128;
  const realH = ch / 128;

  const group = new THREE.Group();

  // 面板
  const panelGeo = new THREE.PlaneGeometry(realW, realH);
  const panelMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
  const panel = new THREE.Mesh(panelGeo, panelMat);

  // 木框（略大的边框平面，深色）
  const frameGeo = new THREE.PlaneGeometry(realW + 0.08, realH + 0.08);
  const frameMat = new THREE.MeshBasicMaterial({ color: 0x3d2817, side: THREE.DoubleSide, depthWrite: false, transparent: true, opacity: 0.8 });
  const frame = new THREE.Mesh(frameGeo, frameMat);
  frame.position.z = -0.01;
  group.add(frame);

  group.add(panel);

  // 支架：两根小木棍
  const stickGeo = new THREE.CylinderGeometry(0.02, 0.02, realH * 0.5, 6);
  const stickMat = new THREE.MeshStandardMaterial({ color: 0x5c3a1e, roughness: 0.7 });
  const stickL = new THREE.Mesh(stickGeo, stickMat);
  stickL.position.set(-realW * 0.35, -realH * 0.7, 0.02);
  group.add(stickL);
  const stickR = new THREE.Mesh(stickGeo, stickMat);
  stickR.position.set(realW * 0.35, -realH * 0.7, 0.02);
  group.add(stickR);

  // 微微前倾
  group.rotation.x = -0.15;

  return group;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function makeIconSprite(emoji, size = 1.2) {

  ctx.textAlign = 'center';

  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(size, size, 1);
  return sprite;
}

const seaMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uScene: { value: 0 }, uCamPos: { value: new THREE.Vector3() } },
  vertexShader: `
    uniform float uTime;
    varying vec3 vWP; varying vec2 vUv; varying float vWave;
    void main(){
      vUv = uv;
      vec3 p = position;
      float w1 = sin(p.x*0.8+uTime*0.7)*0.15;
      float w2 = sin(p.z*1.2+uTime*0.5)*0.1;
      float w3 = sin((p.x+p.z)*0.5+uTime*1.1)*0.08;
      p.y += w1+w2+w3;
      vWave = w1+w2+w3;
      vWP = (modelMatrix*vec4(p,1.0)).xyz;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0);
    }`,
  fragmentShader: `
    uniform float uTime, uScene;
    uniform vec3 uCamPos;
    varying vec3 vWP; varying vec2 vUv; varying float vWave;
    void main(){
      float dist = length(vWP.xz - uCamPos.xz);
      float fogFactor = exp(-dist*0.008);
      vec3 deepBlue = vec3(0.06,0.18,0.35);
      vec3 shallowBlue = vec3(0.12,0.38,0.55);
      vec3 baseColor = mix(shallowBlue, deepBlue, smoothstep(-0.1,0.2,vUv.y));
      float foam = smoothstep(0.15,0.35,vWave);
      baseColor = mix(baseColor, vec3(0.6,0.8,0.95), foam*0.5);
      float spec = pow(max(0.0,vWave*3.0+0.5),4.0)*0.3;
      baseColor += vec3(spec);
      float caustic = sin(vWP.x*3.0+uTime*1.5)*sin(vWP.z*4.0+uTime*1.2)*0.5+0.5;
      baseColor += vec3(0.02,0.04,0.06)*caustic;
      int sc = int(uScene+0.5);
      if(sc>=2) baseColor *= 0.35;
      else if(sc==1) baseColor *= 0.6;
      vec3 fogColor = vec3(0.53,0.6,0.73);
      baseColor = mix(fogColor, baseColor, fogFactor);
      gl_FragColor = vec4(baseColor, 0.88);
    }`,
  transparent: true, side: THREE.DoubleSide,
});

let dungeonGroup = null, dungeonRing = null, dungeonParticles = null;

function enterDungeon(task) {
  if (inDungeon) return;
  inDungeon = true;
  dungeonTask = task;
  window.parent.postMessage({ type: 'islandAction', action: { type: 'dungeonEnter', taskId: task.id } }, '*');

  dungeonGroup = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.CircleGeometry(5, 32),
    new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.8, metalness: 0.3 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; dungeonGroup.add(floor);

  const wall = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 4, 32, 1, true),
    new THREE.MeshStandardMaterial({ color: 0x2a2a4e, roughness: 0.5, side: THREE.BackSide, transparent: true, opacity: 0.8 }));
  wall.position.y = 2; dungeonGroup.add(wall);

  // 副本分形环
  const ringData = createFractalTree(Date.now() % 10000, 2, 1.5, 200);
  const knotGeo = new THREE.BufferGeometry();
  knotGeo.setAttribute('position', new THREE.BufferAttribute(ringData.positions, 3));
  knotGeo.setAttribute('color', new THREE.BufferAttribute(ringData.colors, 3));
  knotGeo.setIndex(new THREE.BufferAttribute(ringData.indices, 1));
  const ring = new THREE.Mesh(knotGeo, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.8 }));
  ring.rotation.x = Math.PI/2;
  ring.scale.setScalar(2);
  ring.position.y = 2.5;
  dungeonGroup.add(ring);
  dungeonRing = ring;

  const taskLabel = makeTextSprite(task.title || '专注', { fontSize: 32, color: '#ffdd44', scale: 3 });
  taskLabel.position.y = 3.8;
  dungeonGroup.add(taskLabel);

  const zone = getZone(task);
  const zc = ZONES[zone]?.color || 0xccaa44;
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2;
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 4, 6),
      new THREE.MeshBasicMaterial({ color: zc, transparent: true, opacity: 0.4 }));
    pillar.position.set(Math.cos(a) * 4, 2, Math.sin(a) * 4);
    dungeonGroup.add(pillar);
  }

  const dpCount = 150;
  const dpGeo = new THREE.BufferGeometry();
  const dpPositions = new Float32Array(dpCount * 3);
  for (let i = 0; i < dpCount; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * 4;
    dpPositions[i * 3] = Math.cos(a) * r;
    dpPositions[i * 3 + 1] = Math.random() * 4;
    dpPositions[i * 3 + 2] = Math.sin(a) * r;
  }
  dpGeo.setAttribute('position', new THREE.BufferAttribute(dpPositions, 3));
  const dpMat = new THREE.PointsMaterial({ color: zc, size: 0.05, transparent: true, opacity: 0.6, depthWrite: false });
  dungeonParticles = new THREE.Points(dpGeo, dpMat);
  dungeonGroup.add(dungeonParticles);

  scene.add(dungeonGroup);
  if (penguinGroup) penguinGroup.visible = false;
  for (const [, e] of taskMeshes) e.group.visible = false;

  document.getElementById('dungeon-ui').classList.add('active');
  document.getElementById('dungeon-task-name').textContent = task.title || '专注';
  document.getElementById('dungeon-exit').onclick = exitDungeon;
  camPos.set(0, 3, 6); camTarget.set(0, 2, 0);
  showBubble(`进入副本: ${task.title}`, new THREE.Vector3(0, 4, 0));
}

function exitDungeon() {
  if (!inDungeon) return;
  inDungeon = false; dungeonTask = null;
  if (dungeonGroup) { scene.remove(dungeonGroup); dungeonGroup = null; }
  dungeonRing = null; dungeonParticles = null;
  if (penguinGroup) penguinGroup.visible = true;
  for (const [, e] of taskMeshes) e.group.visible = true;
  document.getElementById('dungeon-ui').classList.remove('active');
  camPos.copy(penguinPos).add(new THREE.Vector3(0, 6, 14));
  camTarget.copy(penguinPos).add(new THREE.Vector3(0, 0.8, 0));
}

function updateDungeon(dt) {
  if (!inDungeon) return;
  const pomo = pomoState;
  if (pomo.active) {
    const mins = Math.floor(pomo.remaining / 60);
    const secs = pomo.remaining % 60;
    document.getElementById('dungeon-timer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
    const progress = pomo.total > 0 ? (pomo.total - pomo.remaining) / pomo.total : 0;
    document.getElementById('dungeon-progress-bar').style.width = `${progress * 100}%`;
    if (dungeonRing) {
      dungeonRing.rotation.y += dt * 0.5;
      dungeonRing.rotation.x += dt * 0.3;
      dungeonRing.scale.setScalar(1 + progress * 0.2);
    }
    if (dungeonParticles) {
      const sp = dungeonParticles.geometry.attributes.position;
      for (let i = 0; i < sp.count; i++) {
        let y = sp.getY(i) + dt * 0.5;
        if (y > 4) y = 0;
        sp.setY(i, y);
        const a = Math.atan2(sp.getZ(i), sp.getX(i)) + dt * 0.3;
        const r = Math.sqrt(sp.getX(i) ** 2 + sp.getZ(i) ** 2);
        sp.setX(i, Math.cos(a) * r);
        sp.setZ(i, Math.sin(a) * r);
      }
      sp.needsUpdate = true;
    }
  }
  camAngleH += dt * 0.15;
  const targetPos = new THREE.Vector3(Math.sin(camAngleH) * 6, 3, Math.cos(camAngleH) * 6);
  camPos.lerp(targetPos, Math.min(1, dt * 2));
  camera.position.copy(camPos);
  camera.lookAt(0, 2, 0);
}

// Terrain height at a given XZ — 采样当前已加载区块
function sampleTerrainHeight(x, z) {
  let h = -5; // 默认海底
  for (const [key, island] of loadedChunks) {
    const dx = x - island.center.x, dz = z - island.center.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < island.radius + 3) {
      // 岛屿内部：噪声高度
      const noiseH = getIslandHeight(x, z);
      if (noiseH > h) h = noiseH;
    }
  }
  // 也检查初始岛屿（0,0）
  const homeH = getIslandHeight(x, z);
  if (homeH > h) h = homeH;
  return h;
}

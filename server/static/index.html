<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🦞 Claw Todo</title>
  <link rel="stylesheet" href="/style.css?v=9">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d0d0d">
</head>
<body>
  <!-- 登录页 -->
  <div id="auth-screen" class="screen">
    <div class="auth-container">
      <h1>🦞 Claw Todo</h1>
      <div id="setup-form" class="auth-form hidden">
        <h2>首次设置</h2>
        <p class="hint">创建管理员账号</p>
        <input type="text" id="setup-username" placeholder="用户名" autocomplete="username">
        <div class="pwd-field">
          <input type="text" id="setup-password" placeholder="密码" inputmode="text" autocomplete="off">
          <button type="button" class="pwd-toggle" data-target="setup-password">🔒</button>
        </div>
        <button id="setup-btn" class="btn-primary">创建账号</button>
      </div>
      <div id="login-form" class="auth-form">
        <h2>登录</h2>
        <input type="text" id="login-username" placeholder="用户名" autocomplete="username">
        <div class="pwd-field">
          <input type="text" id="login-password" placeholder="密码" inputmode="text" autocomplete="off">
          <button type="button" class="pwd-toggle" data-target="login-password">🔒</button>
        </div>
        <button id="login-btn" class="btn-primary">登录</button>
      </div>
      <div id="auth-error" class="error-msg hidden"></div>
    </div>
  </div>

  <!-- Kanban 主界面 -->
  <div id="app-screen" class="screen hidden">
    <!-- 顶栏 -->
    <header class="app-header">
      <div class="header-left">
        <h1>🦞</h1>
        <span id="online-status" class="status-dot online"></span>
      </div>
      <div class="header-right">
        <button id="add-btn" class="icon-btn" title="新建">➕</button>
        <button id="settings-btn" class="icon-btn" title="设置">⚙️</button>
      </div>
    </header>

    <!-- Kanban 看板 -->
    <div class="kanban-board">
      <div class="kanban-column" data-status="pending">
        <div class="column-header">
          <span class="column-title">📋 待办</span>
          <span class="column-count" id="count-pending">0</span>
        </div>
        <div class="column-body" id="col-pending"></div>
      </div>
      
      <div class="kanban-column" data-status="in_progress">
        <div class="column-header">
          <span class="column-title">🔄 进行中</span>
          <span class="column-count" id="count-in_progress">0</span>
        </div>
        <div class="column-body" id="col-in_progress"></div>
      </div>
      
      <div class="kanban-column" data-status="completed">
        <div class="column-header">
          <span class="column-title">✅ 已完成</span>
          <span class="column-count" id="count-completed">0</span>
        </div>
        <div class="column-body" id="col-completed"></div>
      </div>
      
      <div class="kanban-column" data-status="postponed">
        <div class="column-header">
          <span class="column-title">⏰ 推迟</span>
          <span class="column-count" id="count-postponed">0</span>
        </div>
        <div class="column-body" id="col-postponed"></div>
      </div>
    </div>

    <!-- 新建/编辑 Modal -->
    <div id="todo-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2 id="modal-title">新建待办</h2>
        <input type="text" id="todo-title-input" placeholder="标题 *" required>
        <textarea id="todo-desc-input" placeholder="描述（可选）" rows="2"></textarea>
        <div class="form-row">
          <select id="todo-priority-input">
            <option value="normal">普通</option>
            <option value="high">重要</option>
            <option value="urgent">紧急</option>
            <option value="low">低</option>
          </select>
          <select id="todo-status-input">
            <option value="pending">待办</option>
            <option value="in_progress">进行中</option>
          </select>
        </div>
        <input type="datetime-local" id="todo-due-input">
        <div class="modal-actions">
          <button id="modal-cancel" class="btn-secondary">取消</button>
          <button id="modal-save" class="btn-primary">保存</button>
        </div>
      </div>
    </div>

    <!-- 设置 Modal -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2>⚙️ 设置</h2>
        <div class="settings-section">
          <h3>绑定 Token</h3>
          <p class="hint">用于智能体推送待办</p>
          <div class="token-display">
            <input type="text" id="bind-token" readonly>
            <button id="gen-token-btn" class="btn-secondary">生成</button>
            <button id="copy-token-btn" class="btn-secondary">复制</button>
          </div>
        </div>
        <div class="modal-actions">
          <button id="settings-close" class="btn-primary">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="/app.js?v=9"></script>
</body>
</html>
